<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品销量对比 · 1—4 月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#fafafa;padding:32px 20px;color:#1d1d1f;min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:960px;margin:0 auto}

.page-header{margin-bottom:28px}
.page-title{font-size:32px;font-weight:700;letter-spacing:-.5px}
.page-sub{font-size:13px;color:#86868b;margin-top:6px}

/* 切换器 */
.toggle-group{display:flex;border:1px solid #d2d2d7;background:#fff;margin-bottom:24px}
.toggle-btn{flex:1;padding:12px 16px;font-size:13px;font-weight:500;color:#86868b;background:#fff;border:none;cursor:pointer;font-family:inherit;transition:all .25s ease;border-right:1px solid #e8e8ed}
.toggle-btn:last-child{border-right:none}
.toggle-btn:hover{color:#1d1d1f}
.toggle-btn.active{background:#1d1d1f;color:#fff;font-weight:600}

/* 图表卡片 */
.chart-card{background:#fff;border:1px solid #e8e8ed;padding:24px 24px 16px;margin-bottom:24px}
.chart-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.chart-title{font-size:18px;font-weight:600}
.chart-meta{font-size:11px;color:#86868b}
.legend{display:flex;gap:16px;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#424245}
.swatch{width:10px;height:10px;display:inline-block}
.swatch.a{background:#1d1d1f}
.swatch.b{background:#c7c7cc;border:1px solid #b0b0b6}
.swatch.dim{opacity:.4}

/* 柱状图 */
.bars{display:flex;align-items:flex-end;gap:0;height:220px;border-bottom:1px solid #d2d2d7}
.bar-group{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:6px;height:100%;padding:0 8px}
.bar{width:34px;position:relative;transition:opacity .25s ease, width .25s ease}
.bar .val{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:#1d1d1f;white-space:nowrap}
.bar.fill-a{background:#1d1d1f}
.bar.fill-a .val{color:#1d1d1f}
.bar.fill-b{background:#c7c7cc;border:1px solid #b0b0b6;border-bottom:none}
.bar.fill-b .val{color:#86868b}
.bar.hidden{display:none}

.x-axis{display:flex;border-top:none}
.x-label{flex:1;text-align:center;font-size:11px;color:#86868b;padding-top:10px}
.x-label strong{display:block;font-size:13px;color:#1d1d1f;font-weight:600;margin-top:2px}

/* 明细表 */
.detail-card{background:#fff;border:1px solid #e8e8ed;overflow:hidden}
.detail-head{padding:16px 20px;border-bottom:1px solid #e8e8ed;font-size:18px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:500;color:#86868b;text-transform:uppercase;letter-spacing:.5px;padding:12px 20px;border-bottom:1px solid #e8e8ed}
th.num,td.num{text-align:right}
td{padding:12px 20px;border-bottom:1px solid #e8e8ed;color:#424245}
tr:last-child td{border-bottom:none}
td.month{font-weight:600;color:#1d1d1f}
td .num-strong{font-weight:600;color:#1d1d1f}
td .num-weak{color:#86868b}
td .num-dim{color:#86868b;opacity:.45}
.delta{font-size:11px;color:#86868b}
.pos{color:#1d1d1f;font-weight:600}
.neg{color:#86868b}

/* 汇总栏 */
.compare-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#d2d2d7;border:1px solid #d2d2d7;margin-top:24px}
.compare-item{text-align:center;padding:24px 16px;background:#fff}
.ci-label{font-size:10px;font-weight:500;color:#86868b;letter-spacing:.5px;text-transform:uppercase}
.ci-value{font-size:24px;font-weight:700;color:#1d1d1f;margin-top:6px}
.ci-note{font-size:11px;color:#86868b;margin-top:4px}

.footer-note{margin-top:20px;font-size:11px;color:#86868b;text-align:center}
</style>
</head>
<body>
<div class="container">

  <div class="page-header">
    <div class="page-title">产品销量</div>
    <div class="page-sub">2026 年 1—4 月 · A / B 两款产品销量对比与切换查看</div>
  </div>

  <div class="toggle-group" id="toggle">
    <button class="toggle-btn" data-mode="a" onclick="setMode('a')">产品 A</button>
    <button class="toggle-btn" data-mode="b" onclick="setMode('b')">产品 B</button>
    <button class="toggle-btn active" data-mode="both" onclick="setMode('both')">两者对比</button>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title" id="chartTitle">A × B 销量对比</div>
      <div class="chart-meta">单位：件</div>
    </div>
    <div class="legend" id="legend">
      <span class="legend-item"><span class="swatch a"></span>产品 A</span>
      <span class="legend-item"><span class="swatch b"></span>产品 B</span>
    </div>
    <div class="bars" id="bars"></div>
    <div class="x-axis" id="xAxis"></div>
  </div>

  <div class="detail-card">
    <div class="detail-head">每月明细数值</div>
    <table id="detailTable">
      <thead>
        <tr>
          <th>月份</th>
          <th class="num" id="thA">产品 A</th>
          <th class="num" id="thB">产品 B</th>
          <th class="num">A 环比</th>
          <th class="num">B 环比</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="compare-bar" id="summary">
    <div class="compare-item">
      <div class="ci-label">A 累计</div>
      <div class="ci-value">57</div>
      <div class="ci-note">月均 14.3</div>
    </div>
    <div class="compare-item">
      <div class="ci-label">B 累计</div>
      <div class="ci-value">53</div>
      <div class="ci-note">月均 13.3</div>
    </div>
    <div class="compare-item">
      <div class="ci-label">A − B 差值</div>
      <div class="ci-value">+4</div>
      <div class="ci-note">2 月 B 反超 A</div>
    </div>
  </div>

  <div class="footer-note">数据范围 1—4 月 · 切换上方标签可单独查看某一产品或对比视图</div>

</div>

<script>
const months = ['1 月','2 月','3 月','4 月'];
const A = [10,15,12,20];
const B = [8,11,16,18];
let mode = 'both';

const barsEl = document.getElementById('bars');
const xAxisEl = document.getElementById('xAxis');

function fmtDelta(cur, prev){
  if(prev === null) return '—';
  const d = cur - prev;
  const pct = (d / prev * 100).toFixed(0);
  if(d > 0) return `<span class="pos">+${d}</span> <span class="delta">(+${pct}%)</span>`;
  if(d < 0) return `<span class="neg">${d}</span> <span class="delta">(${pct}%)</span>`;
  return '0';
}

function render(){
  // 柱状图
  const showA = mode === 'a' || mode === 'both';
  const showB = mode === 'b' || mode === 'both';
  const max = Math.max(...A, ...B);
  barsEl.innerHTML = months.map((m,i)=>{
    const bars = [];
    if(showA){
      const h = (A[i]/max)*100;
      bars.push(`<div class="bar fill-a ${showA?'':'hidden'}" style="height:${h}%"><span class="val">${A[i]}</span></div>`);
    }
    if(showB){
      const h = (B[i]/max)*100;
      bars.push(`<div class="bar fill-b" style="height:${h}%"><span class="val">${B[i]}</span></div>`);
    }
    return `<div class="bar-group">${bars.join('')}</div>`;
  }).join('');

  xAxisEl.innerHTML = months.map(m=>`<div class="x-label">${m}</div>`).join('');

  // 标题与图例
  const title = document.getElementById('chartTitle');
  if(mode==='a') title.textContent = '产品 A 销量';
  else if(mode==='b') title.textContent = '产品 B 销量';
  else title.textContent = 'A × B 销量对比';

  document.getElementById('legend').innerHTML =
    (showA ? `<span class="legend-item"><span class="swatch a"></span>产品 A</span>` : `<span class="legend-item"><span class="swatch a dim"></span>产品 A</span>`) +
    (showB ? `<span class="legend-item"><span class="swatch b"></span>产品 B</span>` : `<span class="legend-item"><span class="swatch b dim"></span>产品 B</span>`);

  // 明细表
  const tbody = document.querySelector('#detailTable tbody');
  tbody.innerHTML = months.map((m,i)=>{
    const dA = fmtDelta(A[i], i>0?A[i-1]:null);
    const dB = fmtDelta(B[i], i>0?B[i-1]:null);
    const cellA = showA ? `<span class="num-strong">${A[i]}</span>` : `<span class="num-dim">${A[i]}</span>`;
    const cellB = showB ? `<span class="num-strong">${B[i]}</span>` : `<span class="num-dim">${B[i]}</span>`;
    return `<tr>
      <td class="month">${m}</td>
      <td class="num">${cellA}</td>
      <td class="num">${cellB}</td>
      <td class="num">${showA?dA:'—'}</td>
      <td class="num">${showB?dB:'—'}</td>
    </tr>`;
  }).join('');

  // 表头淡化
  document.getElementById('thA').style.opacity = showA ? 1 : .45;
  document.getElementById('thB').style.opacity = showB ? 1 : .45;

  // 汇总栏淡化
  const items = document.querySelectorAll('#summary .compare-item');
  items[0].style.opacity = showA ? 1 : .45;
  items[1].style.opacity = showB ? 1 : .45;
  items[2].style.opacity = (showA && showB) ? 1 : .45;
}

function setMode(m){
  mode = m;
  document.querySelectorAll('.toggle-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode === m);
  });
  render();
}

render();
</script>
</body>
</html>
