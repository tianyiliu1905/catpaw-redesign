.analysis-table-art { --analysis-ink:#171717; --analysis-paper:#fff; --analysis-gray:#a8aaa8; color:var(--analysis-ink); }
.analysis-table-art .analysis-selection { transform-origin:20px 52px; animation:analysisSelect 2.8s ease-in-out infinite paused; }
.analysis-table-art .analysis-cursor { animation:analysisDrag 2.8s ease-in-out infinite paused; }
.analysis-table-art .analysis-pie { transform-origin:112px 94px; animation:analysisPiePop 2.8s ease-in-out infinite paused; }
.pill:hover .analysis-table-art .analysis-motion,
.pill:focus-visible .analysis-table-art .analysis-motion,
.analysis-table-art:hover .analysis-motion { animation-play-state:running; }
@keyframes analysisSelect {
  0%, 12%, 100% { transform:scale(.5, .333333); opacity:1; }
  32% { transform:scale(.5, 1); opacity:1; }
  44%, 82% { transform:scale(1); opacity:1; }
  92% { transform:scale(1); opacity:0; }
  94% { transform:scale(.5, .333333); opacity:0; }
}
@keyframes analysisDrag {
  0%, 12%, 100% { transform:translate(0, 0); opacity:1; }
  32% { transform:translate(0, 36px); opacity:1; }
  44%, 50% { transform:translate(24px, 36px); opacity:1; }
  60%, 92% { transform:translate(24px, 36px); opacity:0; }
  94% { transform:translate(0, 0); opacity:0; }
}
@keyframes analysisPiePop {
  0%, 48%, 100% { transform:translateY(14px) scale(.35); opacity:0; }
  64% { transform:translateY(-2px) scale(1.06); opacity:1; }
  70%, 82% { transform:translateY(0) scale(1); opacity:1; }
  94% { transform:translateY(-6px) scale(.94); opacity:0; }
}
@media (prefers-reduced-motion:reduce) {
  .analysis-table-art .analysis-motion { animation:none; }
  .analysis-table-art .analysis-selection { transform:scale(1); }
  .analysis-table-art .analysis-cursor { opacity:0; }
  .analysis-table-art .analysis-pie { opacity:1; transform:none; }
}

.analysis-table-art { opacity:.4; transition:opacity .18s ease; }
.pill:hover .analysis-table-art, .pill:focus-visible .analysis-table-art, .analysis-table-art:hover { opacity:1; }
@media (prefers-reduced-motion:reduce) { .analysis-table-art { transition:none; } }

.pill:hover .analysis-table-art,
.pill:focus-visible .analysis-table-art,
.analysis-table-art:hover { --analysis-gray:#7fffb4; }
