.design-pages-art { --design-ink:#171717; --design-paper:#fff; --design-gray:#a8aaa8; color:var(--design-ink); opacity:.4; transition:opacity .18s ease; }
.design-pages-art .design-slide-title { animation:designSlideTitle 3s ease-in-out infinite paused; }
.design-pages-art .design-slide-chart { transform-origin:57px 88px; animation:designSlideChart 3s ease-in-out infinite paused; }
.design-pages-art .design-poster-title { animation:designPosterTitle 3s ease-in-out infinite paused; }
.design-pages-art .design-flower { transform-origin:112px 106px; animation:designFlowerBloom 3s ease-in-out infinite paused; }
.pill:hover .design-pages-art, .pill:focus-visible .design-pages-art, .design-pages-art:hover { opacity:1; }
.pill:hover .design-pages-art .design-motion,
.pill:focus-visible .design-pages-art .design-motion,
.design-pages-art:hover .design-motion { animation-play-state:running; }
@keyframes designSlideTitle {
  0%, 100% { opacity:.45; transform:translateY(2px); }
  18%, 80% { opacity:1; transform:translateY(0); }
}
@keyframes designSlideChart {
  0%, 12%, 100% { opacity:.45; transform:scaleY(.55); }
  34%, 80% { opacity:1; transform:scaleY(1); }
}
@keyframes designPosterTitle {
  0%, 28%, 100% { opacity:.45; transform:translateY(-3px); }
  48%, 80% { opacity:1; transform:translateY(0); }
}
@keyframes designFlowerBloom {
  0%, 38%, 100% { opacity:.55; transform:scale(.7) rotate(-12deg); }
  62% { opacity:1; transform:scale(1.06) rotate(3deg); }
  70%, 80% { opacity:1; transform:scale(1) rotate(0); }
}
@media (prefers-reduced-motion:reduce) {
  .design-pages-art { transition:none; }
  .design-pages-art .design-motion { animation:none; opacity:1; transform:none; }
}

.pill:hover .design-pages-art,
.pill:focus-visible .design-pages-art,
.design-pages-art:hover { --design-gray:#7fffb4; }
