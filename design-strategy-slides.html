<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatPaw · 设计策略</title>
  <style>
    :root{color-scheme:light;--black:#111;--gray:#575757;--muted:#777;--line:#d8d8d8;--paper:#fff;--surround:#f2f2f2;--action-title-size:20px;--detail-label-size:12px;--detail-body-size:16px;--detail-copy-width:320px;--detail-demo-width:860px}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--black)}
    body{background:var(--surround)}
    button{font:inherit}
    button:focus-visible{outline:2px solid var(--black);outline-offset:3px}
    .shell{min-height:100dvh;display:grid;grid-template-rows:1fr auto;gap:12px;padding:24px}
    .stage{position:relative;align-self:center;justify-self:center;width:min(1440px,calc(100vw - 48px),calc((100dvh - 112px)*16/9));aspect-ratio:16/9;background:var(--paper);box-shadow:0 12px 38px #00000012;overflow:hidden}
    .canvas{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(var(--scale,1));transform-origin:top left}
    .slide{position:absolute;inset:0;display:none;padding:36px 48px 40px;background:var(--paper)}
    .slide.active{display:flex;flex-direction:column}
    .slide.preparing{visibility:hidden}
    .topline{position:relative;display:flex;align-items:center;justify-content:space-between;padding-bottom:13px;font-size:13px;font-weight:600;letter-spacing:.025em}
    .deck-progress{position:absolute;top:-1px;left:178px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:318px;letter-spacing:0}
    .deck-progress-step{display:block;color:#aaa;font-size:11px;font-weight:400;line-height:14px}
    .deck-progress-step.is-current{color:var(--black);font-weight:650}
    .deck-progress-step.is-complete{color:var(--gray)}
    .deck-progress-track{display:block;height:2px;margin-top:5px;background:#e6e6e6;overflow:hidden}
    .deck-progress-fill{display:block;width:var(--phase-progress,0%);height:100%;background:var(--black)}
    .topline .right{color:var(--gray);font-weight:400;font-variant-numeric:tabular-nums}
    .mainline{margin-top:24px;display:flex;align-items:center;gap:18px;color:var(--gray);font-size:14px}
    .mainline .number{font-weight:700;color:var(--black)}
    .mainline .status{margin-left:auto;font-size:12px;color:var(--gray)}
    h1,h2,h3,p{margin:0}
    h1{margin-top:22px;max-width:1128px;font-size:40px;font-weight:680;line-height:1.22;letter-spacing:-.045em}
    .body{display:grid;grid-template-columns:36% minmax(0,1fr);gap:52px;flex:1;min-height:0;margin-top:43px}
    .action-slide .mainline,.action-slide h1{max-width:var(--detail-copy-width)}
    .action-slide .mainline{gap:12px}
    .action-slide .mainline .status{margin-left:0;flex:none;white-space:nowrap}
    .action-slide .body{display:block;margin-top:30px}
    .action-slide .left-content{width:var(--detail-copy-width);padding-top:12px}
    .action-slide .user-concern{margin-bottom:14px;padding-bottom:10px}
    .action-slide .design-slot{position:absolute;top:96px;right:24px;bottom:40px;width:var(--detail-demo-width)}
    .left-content{padding-top:22px;min-width:0}
    .label{font-size:var(--detail-label-size);letter-spacing:.08em;color:var(--muted);font-weight:620}
    .actions{border-top:1px solid var(--line);padding-top:20px;margin-top:34px;min-width:0}
    .action-list{margin-top:9px}
    .action{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
    .action:last-child{border-bottom:0}
    .action-no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
    .action h3{font-size:15px;line-height:1.44;font-weight:600}
    .action-detail{min-width:0}
    .user-concern{display:block;margin-bottom:18px;padding-bottom:15px}
    .user-concern .label{display:block}
    .user-concern p{margin-top:14px;color:var(--gray);font-size:var(--action-title-size);line-height:1.38;font-weight:650}
    .action-detail h3{margin-top:14px;font-size:var(--action-title-size);line-height:1.38;font-weight:650}
    .action-detail p{margin-top:12px;font-size:var(--detail-body-size);line-height:1.58;color:var(--gray)}
    .design-slot{display:flex;flex-direction:column;min-width:0;min-height:0;margin:0;border:1px solid var(--line)}
    .design-slot.has-demo{border:0}
    #slide-3\.1-analysis .design-slot{border:0}
    .design-slot-body{display:grid;place-items:center;flex:1;min-height:0;color:#aaa;font-size:16px}
    .demo-slot-body{display:block;overflow:hidden;background:#bde5e8 url('./assets/demo-wallpaper.png') center / cover no-repeat}
    .demo-viewport{position:relative;width:100%;height:100%;overflow:hidden}
    .demo-viewport iframe{position:absolute;width:1200px;height:800px;border:0;transform-origin:top left;pointer-events:none;visibility:hidden}
    .demo-viewport iframe.is-ready{visibility:visible}
    .phase-demo-context{position:absolute;top:88px;left:430px;right:48px}
    .phase-demo-context .user-concern{margin-bottom:12px;padding-bottom:12px}
    .phase-demo-context .user-concern p{margin-top:8px}
    .phase-demo-context .action-detail h3{margin-top:8px}
    .phase-demo-context .action-detail p{margin-top:9px}
    .phase-demo-grid{position:absolute;top:300px;right:32px;bottom:28px;left:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .phase-demo-card{display:flex;flex-direction:column;min-width:0;min-height:0;margin:0}
    .phase-demo-card figcaption{display:flex;align-items:baseline;gap:10px;min-height:39px}
    .phase-demo-card figcaption strong{font-size:17px;font-weight:650}
    .phase-demo-card figcaption span{color:var(--muted);font-size:12px}
    .phase-demo-card .demo-viewport{flex:1;min-height:0;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
    .phase-demo-card iframe{width:600px;height:620px}
    .process-pair{position:absolute;top:284px;right:40px;bottom:28px;left:40px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .process-pair-panel{display:flex;flex-direction:column;min-width:0;min-height:0;margin:0}
    .process-pair-panel figcaption{display:flex;align-items:baseline;gap:12px;min-height:34px;font-size:16px;font-weight:650}
    .process-pair-panel figcaption span{color:var(--muted);font-size:12px;font-weight:400}
    .process-pair-panel .demo-viewport{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;background:#fff}
    .process-pair-panel iframe{width:660px;height:500px}
    .process-schematic{--process-intent-height:70px;--process-block-gap:6px;--process-plan-compact-height:48px;position:relative;overflow:hidden;display:flex;flex:1;flex-direction:column;min-height:0;padding:16px 0 0}
    .process-tabs{display:inline-flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
    .process-tabs button{margin-bottom:-1px;padding:5px 8px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:12px;line-height:1.5;cursor:pointer}
    .process-tabs button[aria-selected="true"]{border-color:var(--black);color:var(--black);font-weight:650}
    .process-map-status{display:block;position:relative;background:transparent;text-align:left;cursor:pointer;width:min(100%,440px);min-height:22px;margin:0 auto 8px;padding:7px 32px 7px 10px;border:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.5}
    .process-map-status::after{content:"";position:absolute;right:13px;top:12px;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
    .process-map-status[aria-expanded="true"]::after{transform:rotate(45deg)}
    .process-map-history{position:absolute;top:57px;left:50%;z-index:5;width:min(100%,440px);max-height:220px;overflow:auto;padding:7px 10px;border:1px solid var(--line);background:#fff;transform:translateX(-50%);box-shadow:0 5px 15px #0000000d}
    .process-map-history[hidden]{display:none}
    .process-map-history ol{margin:0;padding:0;list-style:none}
    .process-map-history li{padding:6px 0;color:var(--gray);font-size:13px;line-height:1.5}
    .process-map-history li::before{content:"✓";margin-right:10px;color:var(--muted)}
    .process-map-tools.is-idle{visibility:hidden}
    .process-tool-transfer{position:absolute!important;z-index:6;flex-direction:column;gap:5px;min-height:0;pointer-events:none;transform-origin:top left}
    .process-tool-transfer small{font-size:11px;font-weight:400}
    .process-map-columns{position:relative;flex:1;min-height:0}
    .process-map-column{width:min(100%,440px);margin:0 auto}
    .process-map-column[hidden],.process-map-column:not(.is-current){display:none}
    .process-map-body{display:flex;flex-direction:column;gap:var(--process-block-gap);padding-top:12px}
    .process-map-block{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:10px 6px;background:#ddd;color:var(--black);font-size:13px;font-weight:600;line-height:1.5;text-align:center}
    .process-map-intent,.process-map-plan{min-height:var(--process-intent-height)}
    .process-map-plan-compact{min-height:var(--process-plan-compact-height);background:#eee;color:var(--muted)}
    .process-map-tools{min-height:126px;flex-direction:column;gap:5px}
    .process-map-tools small{font-size:11px;font-weight:400}
    .process-map-folded{height:14px;padding:0;background:#eee}
    .process-map-result{min-height:180px}
    .process-map-column.is-current .process-map-tools::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,#ffffff99 50%,transparent 80%);transform:translateX(-100%);animation:processMapSweep 2s ease-in-out infinite}
    .process-map-column.is-current .process-map-result{animation:processMapResult .5s ease-out both}
    .process-map-caption{min-height:48px;margin-top:14px;font-size:14px;line-height:1.5;color:var(--gray)}
    .process-schematic[data-transition="before-working"] .process-map-column[data-phase="before"]{position:absolute;top:0;left:50%;z-index:1;display:block;transform:translateX(-50%);pointer-events:none}
    .process-schematic[data-transition="before-working"] .process-map-column[data-phase="before"] .process-map-plan{visibility:hidden}
    .process-schematic[data-transition="before-working"] .process-map-intent{animation:processIntentExit .42s ease-in both}
    .process-schematic[data-transition="before-working"] .process-map-column[data-phase="working"]{position:relative;z-index:2}
    .process-schematic[data-transition="before-working"] .process-map-plan-compact{animation:processPlanMove .76s cubic-bezier(.22,.68,0,1) both}
    .process-schematic[data-transition="before-working"] .process-map-tools{animation:processToolsEnter .42s .72s cubic-bezier(.22,.68,0,1) both}
    @keyframes processIntentExit{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-120%)}}
    @keyframes processPlanMove{0%{transform:translateY(calc(var(--process-intent-height) + var(--process-block-gap)));height:var(--process-intent-height);background:#ddd;color:var(--black)}55%{transform:translateY(0);height:var(--process-intent-height);background:#ddd;color:var(--black)}100%{transform:translateY(0);height:var(--process-plan-compact-height);background:#eee;color:var(--muted)}}
    @keyframes processToolsEnter{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
    @media(prefers-reduced-motion:reduce){.process-schematic[data-transition="before-working"] .process-map-column[data-phase="before"]{display:none}.process-schematic[data-transition="before-working"] :is(.process-map-intent,.process-map-plan-compact,.process-map-tools){animation:none}}
    @keyframes processMapSweep{to{transform:translateX(100%)}}
    @keyframes processMapResult{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.process-map-column{transition:none}.process-map-column.is-current,.process-map-column.is-current .process-map-tools::after,.process-map-column.is-current .process-map-result{animation:none}}
    .layout-demo-slide .phase-demo-grid{top:310px}
    .layout-demo-card figcaption{flex-direction:column;gap:5px;min-height:0}
    .layout-demo-description{min-height:44px;margin:10px 0 14px;color:var(--gray);font-size:14px;line-height:1.5}
    .layout-demo-card .demo-viewport{border:0;border-radius:0;background:#bde5e8 url('./assets/demo-wallpaper.png') center / cover no-repeat}
    .layout-demo-card iframe{width:1200px;height:800px}
    .context-summary-preview{max-width:600px;margin:24px auto 0;padding:22px 24px;border:1px solid var(--line);border-radius:14px}
    .context-summary-preview>h3{font-size:20px;line-height:1.4}
    .context-summary-preview>p{margin-top:6px;color:var(--gray);font-size:14px;line-height:1.5}
    .context-summary-section{margin-top:20px}
    .context-summary-section h4{margin:0 0 7px;color:var(--muted);font-size:12px;font-weight:500}
    .context-summary-section p{font-size:15px;line-height:1.65;color:var(--gray)}
    .process-demo{display:flex;flex-direction:column;width:100%;height:100%;padding:27px 30px;background:#fff}
    .process-demo-heading{padding-bottom:16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
    .process-demo-flow{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));flex:1;min-height:0}
    .process-demo-phase{display:grid;grid-template-columns:114px minmax(0,1fr);gap:21px;min-height:0;padding:21px 0;border-bottom:1px solid var(--line)}
    .process-demo-phase:last-child{border-bottom:0}
    .process-demo-phase>span{color:var(--muted);font-size:12px;font-weight:600}
    .process-demo-content{min-width:0;font-size:14px;line-height:1.45}
    .process-demo-content strong{display:block;font-weight:650}
    .process-demo-line{margin-top:10px;color:var(--gray);font-size:12px}
    .process-demo-box{margin-top:9px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;color:var(--gray);font-size:12px}
    .process-demo-box b{color:var(--black);font-weight:600}
    .process-demo-current{border-color:var(--black);color:var(--black)}
    .process-demo-columns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .process-demo-columns .process-demo-box{margin-top:9px}
    .strategy-diagram{width:100%;height:100%;padding:27px 30px;background:#fff;color:var(--black)}
    .strategy-diagram-heading{padding-bottom:16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
    .strategy-diagram-caption{margin-top:18px;color:var(--gray);font-size:13px;line-height:1.5}
    .workspace-layout{display:grid;gap:14px;height:310px;margin-top:25px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fafafa}
    .workspace-layout.face{grid-template-columns:1.7fr 1fr}
    .workspace-layout.side{grid-template-columns:1.35fr 1fr}
    .workspace-layout.call{display:block;position:relative}
    .workspace-pane{min-width:0;padding:15px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .workspace-pane>strong{display:block;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:12px;font-weight:650}
    .workspace-chat-line{margin-top:15px;padding:11px;border-radius:8px;background:#f5f5f5;font-size:12px;line-height:1.5}
    .workspace-chat-line.reply{margin-left:32px;background:#fff;border:1px solid var(--line)}
    .workspace-chat-input{margin-top:25px;padding:12px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px}
    .workspace-artifact{display:grid;grid-template-columns:44px 1fr;gap:10px;height:233px;margin-top:10px}
    .workspace-thumbs{display:flex;flex-direction:column;gap:7px}
    .workspace-thumbs i{display:block;height:34px;border:1px solid var(--line);background:#f5f5f5}
    .workspace-thumbs i:first-child{border-color:var(--black)}
    .workspace-page{position:relative;padding:17px;border:1px solid var(--line);background:#fff}
    .workspace-page b{display:block;width:68%;height:8px;background:#333}
    .workspace-page i{display:block;height:6px;margin-top:13px;background:#ddd}
    .workspace-page i:nth-of-type(2){width:81%}
    .workspace-page i:nth-of-type(3){width:56%}
    .workspace-layout.call .workspace-pane{height:100%}
    .workspace-layout.call .workspace-artifact{height:233px}
    .workspace-annotation{position:absolute;right:19px;top:112px;padding:8px 10px;border:1px solid var(--black);border-radius:7px;background:#fff;font-size:11px}
    .workspace-call-entry{position:absolute;right:30px;bottom:28px;padding:10px 13px;border:1px solid var(--black);border-radius:18px;background:#fff;font-size:12px}
    .workspace-key{display:flex;gap:17px;margin-top:17px;color:var(--gray);font-size:12px}
    .workspace-key strong{color:var(--black);font-weight:650}
    .participation-chart{width:100%;height:348px;margin-top:18px}
    .participation-chart svg{display:block;width:100%;height:100%}
    .participation-chart text{font-family:inherit;fill:var(--black)}
    .participation-chart .axis-label{font-size:14px;font-weight:650}
    .participation-chart .axis-end{font-size:11px;fill:var(--muted)}
    .participation-chart .point-title{font-size:15px;font-weight:650}
    .participation-chart .point-note{font-size:11px;fill:var(--gray)}
    .participation-chart .point text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .participation-chart .point circle{fill:#fff;stroke:var(--black);stroke-width:2}
    .participation-chart .point.pet circle{fill:var(--black)}
    .mode-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
    .mode-panel{min-height:280px;padding:20px;border:1px solid var(--line);border-radius:10px}
    .mode-panel.is-default{border-color:var(--black)}
    .mode-panel small{display:block;color:var(--muted);font-size:11px}
    .mode-panel h3{margin-top:8px;font-size:19px}
    .mode-panel p{margin-top:24px;font-size:15px;line-height:1.55}
    .mode-panel ul{margin:22px 0 0;padding:0;list-style:none}
    .mode-panel li{padding:9px 0;border-top:1px solid var(--line);color:var(--gray);font-size:12px}
    .mode-shared{margin-top:18px;padding:12px 16px;border:1px solid var(--line);color:var(--gray);font-size:12px}
    .result-formats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
    .result-format{min-height:280px;padding:18px;border:1px solid var(--line);border-radius:10px}
    .result-format small,.result-format strong{display:block}
    .result-format small{color:var(--muted);font-size:11px}
    .result-format strong{margin-top:8px;font-size:17px}
    .result-format .visual{display:flex;align-items:flex-end;gap:10px;height:100px;margin-top:30px;padding-bottom:10px;border-bottom:1px solid var(--line)}
    .result-format .visual i{display:block;flex:1;background:#d9d9d9}
    .result-format .visual i:last-child{background:#333}
    .result-format .compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:30px}
    .result-format .compare span{display:grid;place-items:center;height:100px;border:1px solid var(--line);font-size:12px}
    .result-format .compare span:last-child{border-color:var(--black)}
    .result-format .plain{margin-top:30px;font-size:22px;font-weight:650;line-height:1.35}
    .result-format p{margin-top:17px;color:var(--gray);font-size:12px;line-height:1.5}
    .result-review{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;margin-top:25px}
    .result-review-main,.result-review-side{min-height:295px;padding:21px;border:1px solid var(--line);border-radius:10px}
    .result-review-main h3,.result-review-side h3{font-size:17px}
    .result-review-main p,.result-review-side p{margin-top:13px;color:var(--gray);font-size:12px;line-height:1.55}
    .result-review-row{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
    .result-review-row:first-of-type{margin-top:20px}
    .result-review-row b{font-weight:650}
    .result-review-link{display:block;margin-top:21px;padding-top:12px;border-top:1px solid var(--line);font-size:12px}
    .reply-decision{display:flex;flex-direction:column;gap:14px;padding:28px}
    .reply-decision h2{font-size:21px;line-height:1.4}
    .reply-decision-intro{color:var(--gray);font-size:14px;line-height:1.6}
    .reply-decision-row{display:grid;grid-template-columns:124px 22px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:16px}
    .reply-decision-row h3{font-size:16px;line-height:1.4}
    .reply-decision-row p{margin-top:6px;color:var(--gray);font-size:13px;line-height:1.5}
    .reply-decision-row .reply-arrow{font-size:22px;text-align:center}
    .reply-decision-example{border-left:2px solid var(--black);padding-left:14px}
    .reply-decision-example strong{display:block;font-size:15px;line-height:1.45}
    .reply-decision-note{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
    .reply-analysis-premise{margin-bottom:18px}
    .reply-table-styles{display:flex;flex-direction:column;gap:16px;padding:24px;min-height:0}
    .reply-table-styles>h2{font-size:20px;line-height:1.4}
    .reply-table-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
    .reply-table-panel{min-width:0}
    .reply-table-panel:last-child{grid-column:1/-1}
    .reply-table-panel h3{font-size:15px;line-height:1.5;margin-bottom:10px}

        </section>`;
      if(slide.kind==='chapter')return `
        <section class="slide story-slide chapter-slide" id="slide-${escapeHtml(slide.no)}" aria-label="${escapeHtml(slide.label+'：'+slide.title)}">
          ${topline(index)}
          <div class="story-kicker">${escapeHtml(slide.label)}</div>
          <h1>${escapeHtml(slide.title)}</h1>
          <p class="story-copy">${escapeHtml(slide.story)}</p>
          <div class="chapter-questions"><span class="label">用户此刻正在想</span><div class="chapter-question-list"${slide.no==='strategy-1'?' aria-label="从能力认知、形成预期到开始尝试的用户问题流程"':''}>${slide.questions.map(question=>`<p>${escapeHtml(question)}</p>`).join('')}</div></div>
          <div class="story-steps">${slide.steps.map((step,i)=>`<div class="story-step"><span>0${i+1}</span><strong>${escapeHtml(step)}</strong></div>`).join('')}</div>
        </section>`;
      if(slide.kind==='participation-analysis')return `
        <section class="slide action-slide analysis-slide" id="slide-${escapeHtml(slide.no)}" aria-label="策略三场景分析：${escapeHtml(slide.title)}">
          ${topline(index)}
          <div class="mainline"><span class="number">3.1</span><span>策略三 · 场景分析</span></div>
          <h1>${escapeHtml(slide.title)}</h1>
          <div class="body"><div class="left-content"><div class="action-detail"><span class="label">场景分析</span><h3>谁在场，谁在持续工作？</h3><p>同一份完整产物，在讨论、边看边改、专心批注和人暂离时，需要不同的窗口关系。</p></div><p class="design-note">先看人和 Agent 的参与度，再分别设计四种状态；切换时仍沿用同一任务、产物和修改上下文。</p></div><figure class="design-slot" aria-label="人和 Agent 参与度的四状态分析图">${participationAnalysis}</figure></div>
        </section>`;
      if(slide.kind==='reply-analysis')return `
        <section class="slide action-slide analysis-slide" id="slide-2.3" aria-label="2.3 结果可视：场景分析">
          ${topline(index)}
          <div class="mainline"><span class="number">2.3</span><span>策略二 · 场景分析</span></div>
          <h1>结果可视</h1>
          <div class="body"><div class="left-content">
            <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(slide.analysis.concern)}</p></div>
            <div class="action-detail reply-analysis-premise"><span class="label">问题洞察</span><h3>${escapeHtml(slide.analysis.premiseTitle)}</h3><p>${escapeHtml(slide.analysis.premise)}</p></div>
            <div class="action-detail"><span class="label">场景分析</span><h3>${escapeHtml(slide.analysis.title)}</h3><p>${escapeHtml(slide.analysis.body)}</p></div>
          </div><figure class="design-slot" aria-label="回复形式的场景分析">${replyDecisionDemo}</figure></div>
        </section>`;
      if(slide.no==='3.1')return `
        <section class="slide phase-demo-slide layout-demo-slide" id="slide-3.1" aria-label="3.1.1 布局可适：三种参与场景并排比较">
          ${topline(index)}
          <div class="mainline"><span class="number">3.1</span><span>${escapeHtml(slide.strategy)}</span></div>
          <h1>${escapeHtml(pageView[slide.pointNo][0])}</h1>
          <div class="phase-demo-context">
            <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(actionConcerns[slide.pointNo][slide.actionIndex])}</p></div>
            <div class="action-detail"><span class="label">设计动作 3.1.1</span><h3>${escapeHtml(slide.action[0])}</h3><p>${escapeHtml(slide.action[1])}</p></div>
          </div>
          ${layoutComparisonsDemo}
        </section>`;
      if(slide.no==='2.1')return `
        <section class="slide phase-demo-slide" id="slide-2.1" aria-label="2.1 过程可懂：设计研究与阶段展示分析">
          ${topline(index)}
          <div class="mainline"><span class="number">2.1</span><span>${escapeHtml(slide.strategy)}</span></div>
          <h1>${escapeHtml(pageView[slide.pointNo][0])}</h1>
          <div class="phase-demo-context">
            <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(slide.research.concern)}</p></div>
            <div class="action-detail"><span class="label">设计研究</span><h3>${escapeHtml(slide.research.title)}</h3><p>${escapeHtml(slide.research.body)}</p></div>
          </div>
          ${processDemo}
        </section>`;
      return `
        <section class="slide action-slide" id="slide-${escapeHtml(slide.no)}" aria-label="${escapeHtml(slide.pointNo+' '+pageView[slide.pointNo][0]+'：'+slide.action[0])}">
          ${topline(index)}
          <div class="mainline"><span class="number">${escapeHtml(slide.pointNo)}</span><span>${escapeHtml(slide.strategy)}</span>${slide.status?`<span class="status">${escapeHtml(slide.status)}</span>`:''}</div>
          <h1>${escapeHtml(pageView[slide.pointNo][0])}</h1>
          <div class="body">
            <div class="left-content">
              <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(actionConcerns[slide.pointNo][slide.actionIndex])}</p></div>
              <div class="action-detail"><span class="label">设计动作 ${escapeHtml(`${slide.pointNo}.${slide.actionIndex+1}`)}</span><h3>${escapeHtml(slide.action[0])}</h3><p>${escapeHtml(slide.action[1])}</p></div>
              ${slide.note&&slide.actionIndex===0?`<p class="design-note">${escapeHtml(slide.note)}</p>`:''}
              ${slide.pointNo==='1.1'&&slide.actionIndex===0?`<p class="capability-source">四类是任务归并，并非统计标签。ToC 首轮 n=3,322；ToB 抽样 n=938。来源：<a href="https://km.sankuai.com/collabpage/2789760458" target="_blank" rel="noopener noreferrer">ToC 报告</a> · <a href="https://km.sankuai.com/collabpage/2786789535" target="_blank" rel="noopener noreferrer">ToB 报告</a></p>`:''}
            </div>
            <figure class="design-slot ${CatPawStrategyScenes.scenes[slide.no]||slide.no==='3.1-2'?'has-demo':''}" data-design-slot="${escapeHtml(slide.no)}" aria-label="设计稿：${escapeHtml(pageView[slide.pointNo][1])}">${slide.no==='2.4'?contextSummaryDemo:CatPawStrategyScenes.scenes[slide.no]?`<div class="design-slot-body demo-slot-body"><div class="demo-viewport"><iframe title="CatPaw Demo：${escapeHtml(slide.action[0])}" data-scene="${escapeHtml(slide.no)}" src="./index.html?strategyScene=${escapeHtml(slide.no)}" tabindex="-1" aria-hidden="true" scrolling="no"></iframe></div></div>`:slide.no==='2.1'?processDemo:slide.no==='2.1-5'?modeDemo:slide.pointNo==='2.2'?`<div class="design-slot-body">${slide.actionIndex===0?'中途干预':'异常恢复'}设计待定</div>`:slide.pointNo==='2.3'?replyTableStylesDemo:slide.pointNo==='3.1'?workspaceDemo[slide.actionIndex===0?0:3]:slide.pointNo==='3.4'?continuationDemo:slide.pointNo==='3.3'?`<div class="design-slot-body">版本界面待设计</div>`:`<div class="design-slot-body">对应设计稿放在这里</div>`}</figure>
          </div>
        </section>`;
    }).join('');

    const pages=[...canvas.querySelectorAll('.slide')];
    const stage=document.querySelector('.stage');
    const previous=document.getElementById('prev');
    const next=document.getElementById('next');
    const counter=document.getElementById('counter');
    let sharedGreetingText='';
    const fromHash=()=>{
      const hash=decodeURIComponent(location.hash);
      const canonical=hash==='#1.2-3'?'#1.3':/^#1\.1-[23]$/.test(hash)?'#1.1':/^#2\.4-[23]$/.test(hash)?'#2.4':hash==='#2.3-4'?'#2.3-3':hash==='#3.1-3'?'#3.1':hash==='#3.1-4'?'#3.1-2':hash==='#3.3-3'?'#3.3-2':hash==='#strategy-4'?'#strategy-3':/^#4(?:-\d+)?$/.test(hash)?'#3.4':hash;
      return slides.findIndex(slide=>'#'+slide.no===canonical);
    };
    let current=Math.max(0,fromHash());
    function fitDemo(page){
      page.querySelectorAll('.demo-viewport').forEach(viewport=>{
        if(!viewport.clientWidth||!viewport.clientHeight)return;
        const frame=viewport.querySelector('iframe');
        const demoWidth=Number(viewport.dataset.demoWidth)||1200;
        const demoHeight=Number(viewport.dataset.demoHeight)||800;
        // Preserve the exterior wallpaper so the app window has breathing room on both sides.
        const scale=Math.min(viewport.clientWidth/demoWidth,viewport.clientHeight/demoHeight);
        frame.style.transform=`scale(${scale})`;
        frame.style.left=`${(viewport.clientWidth-demoWidth*scale)/2}px`;
        frame.style.top=`${(viewport.clientHeight-demoHeight*scale)/2}px`;
      });
    }
    function clearProcessToolTransfer(diagram){
      const effect=diagram.processToolEffect;
      if(!effect)return;
      effect.animations.forEach(animation=>animation.cancel());
      effect.timers.forEach(timer=>clearTimeout(timer));
      effect.ghost?.remove();
      diagram.processToolEffect=null;
      if(diagram.dataset.historyPinned!=='true'){
        diagram.querySelector('[data-process-history]').hidden=true;
        diagram.querySelector('[data-process-status]').setAttribute('aria-expanded','false');
      }
    }
    function syncProcessToolHistory(diagram,frameIndex,tools){
      const history=diagram.querySelector('[data-process-history]');
      if(!history)return;
      const previous=diagram.processToolState;
      const completed=Array.isArray(tools?.completed)?tools.completed:[];
      const current=tools?.current||null;
      diagram.querySelector('[data-process-status]').disabled=completed.length===0;
      const transfer=CatPawStrategyScenes.completedToolTransfer(previous,frameIndex,completed);
      const block=diagram.querySelector('.process-map-tools');
      const source=transfer?{rect:block.getBoundingClientRect(),ghost:block.cloneNode(true)}:null;
      clearProcessToolTransfer(diagram);
      const records=diagram.querySelector('[data-process-completed]');
      records.replaceChildren(...completed.map(item=>{
        const row=document.createElement('li');row.dataset.toolRecord=String(item.id);row.textContent=item.name;return row;
      }));
      diagram.processToolState={frame:frameIndex,current};
      block.classList.toggle('is-idle',!current);
      if(frameIndex===0||completed.length===0){diagram.dataset.historyPinned='false';history.hidden=true;diagram.querySelector('[data-process-status]').setAttribute('aria-expanded','false')}
      if(!source||!source.rect.width||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
      const header=diagram.querySelector('[data-process-status]').getBoundingClientRect();
      const destination={left:source.rect.left,top:header.bottom+6,width:source.rect.width,height:24};
      const origin=diagram.getBoundingClientRect();
      const scale=origin.width/diagram.offsetWidth||1;
      const ghost=source.ghost;
      ghost.className='process-map-block process-tool-transfer';ghost.setAttribute('aria-hidden','true');
      Object.assign(ghost.style,{left:`${(source.rect.left-origin.left)/scale}px`,top:`${(source.rect.top-origin.top)/scale-diagram.clientTop}px`,width:`${source.rect.width/scale}px`,height:`${source.rect.height/scale}px`});
      diagram.append(ghost);
      const animations=[ghost.animate([{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:.6,transform:'translate(0,-18px) scale(.98)',offset:.22},{opacity:0,transform:`translate(${(destination.left-source.rect.left)/scale}px,${(destination.top-source.rect.top)/scale}px) scale(${destination.width/source.rect.width},${destination.height/source.rect.height})`}],{duration:650,easing:'cubic-bezier(.22,.68,0,1)',fill:'forwards'})];
      if(current)animations.push(block.animate([{opacity:0,transform:'translateX(40px)'},{opacity:1,transform:'translateX(0)'}],{delay:650,duration:320,fill:'backwards',easing:'ease-out'}));
      const effect={animations,ghost,timers:[]};diagram.processToolEffect=effect;
      effect.timers.push(setTimeout(()=>{if(diagram.processToolEffect===effect)ghost.remove()},650));

    }
    function syncProcessDiagram(page,frameIndex,activity='',status='',tools=null){
      const phase=CatPawStrategyScenes.processPhaseForFrame(frameIndex);
      const diagram=page.querySelector('.process-schematic');
      if(!phase||!diagram)return;
      if(typeof diagram.animate==='function')syncProcessToolHistory(diagram,frameIndex,tools);
      const changed=diagram.dataset.phase!==phase;
      if(changed)diagram.dataset.transition=diagram.dataset.phase==='before'&&phase==='working'?'before-working':'';
      diagram.dataset.phase=phase;
      const statusLabel=typeof status==='string'&&status?status:{before:'思考中',working:'生成中',after:'已完成'}[phase];
      const statusElement=diagram.querySelector('[data-process-status]');
      statusElement.textContent='全局响应状态';
      statusElement.setAttribute('aria-label',`全局响应状态：${statusLabel}`);
      page.querySelectorAll('.process-map-column').forEach(column=>{
        column.hidden=column.dataset.phase!==phase;
        column.setAttribute('aria-hidden',String(column.hidden));
        column.classList.toggle('is-current',!column.hidden);
        if(column.dataset.phase===phase)column.setAttribute('aria-current','step');else column.removeAttribute('aria-current');
      });
      page.querySelectorAll('[data-process-frame]').forEach(tab=>{
        const selected=CatPawStrategyScenes.processPhaseForFrame(Number(tab.dataset.processFrame))===phase;
        tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;
      });
      page.querySelector('[data-process-phase-label]').textContent={before:'初步生成',working:'生成中',after:'生成后'}[phase];
      if(changed||frameIndex===0)diagram.querySelector('.process-map-caption').textContent={before:'先确认理解与目标，展示任务规划。',working:'任务规划收成一行，突出当前工具调用，保留阶段总结。',after:'收起过程信息，直接呈现结果与产物。'}[phase];
      diagram.querySelector('[data-process-tool]').textContent=phase==='working'&&typeof activity==='string'&&activity?activity:'突出当前执行';
    }
    function revealDemo(page){
      page.querySelectorAll('.demo-viewport iframe').forEach(frame=>{
        if(frame.dataset.prepared!=='true'||!page.classList.contains('active'))return;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          if(page.classList.contains('active')&&frame.dataset.prepared==='true')frame.classList.add('is-ready');
        }));
      });
    }
    function fit(){canvas.style.setProperty('--scale',stage.clientWidth/1280);fitDemo(pages[current])}
    function show(index,updateHash=true){
      pages[current]?.querySelectorAll('.process-schematic').forEach(clearProcessToolTransfer);
      pages[current]?.querySelectorAll('.demo-viewport iframe').forEach(frame=>{
        frame.contentWindow?.postMessage({type:'catpaw:scene-deactivate',scene:frame.dataset.scene},'*');
      });
      current=Math.max(0,Math.min(pages.length-1,index));
      if(document.activeElement?.matches('iframe')){
        stage.setAttribute('tabindex','-1');
        stage.focus({preventScroll:true});
      }
      const page=pages[current];
      page.classList.add('preparing');
      const frames=page.querySelectorAll('.demo-viewport iframe');
      frames.forEach(frame=>{frame.classList.remove('is-ready');delete frame.dataset.prepared;delete frame.dataset.requestedFrame;});
      pages.forEach((page,i)=>page.classList.toggle('active',i===current));
      fitDemo(page);
      if(slides[current].no==='2.1')syncProcessDiagram(page,0);
      page.classList.remove('preparing');
      frames.forEach(frame=>{
        if(frame.dataset.connected==='true')frame.contentWindow.postMessage({type:'catpaw:scene-activate',scene:frame.dataset.scene,greetingText:sharedGreetingText},'*');
      });
      revealDemo(page);
      previous.disabled=current===0;next.disabled=current===pages.length-1;
      counter.value=`${current+1} / ${pages.length}`;
      document.title=`${slides[current].kind==='action'?slides[current].pointNo+' '+slides[current].action[0]:slides[current].title} · CatPaw 设计策略`;
      if(updateHash)history.replaceState(null,'','#'+slides[current].no);
    }
    canvas.addEventListener('click',event=>{
      const tab=event.target.closest('[data-process-frame]');
      if(!tab)return;
      const page=tab.closest('.slide');
      if(!page.classList.contains('active'))return;
      const frame=page.querySelector('iframe[data-process-sync]');
      const target=Number(tab.dataset.processFrame);
      if(!CatPawStrategyScenes.processPhaseForFrame(target))return;
      frame.dataset.requestedFrame=String(target);
      if(frame.dataset.connected==='true')frame.contentWindow.postMessage({type:'catpaw:scene-seek',scene:frame.dataset.scene,frame:target},'*');
    });
    canvas.addEventListener('keydown',event=>{
      if(event.target.closest('[data-process-status]')&&['Enter',' '].includes(event.key)){event.stopPropagation();return}
      const tab=event.target.closest('[data-process-frame]');
      if(!tab)return;
      const tabs=[...tab.closest('[data-process-tabs]').querySelectorAll('[data-process-frame]')];
      let index=tabs.indexOf(tab);
      if(['ArrowRight','ArrowLeft','Home','End'].includes(event.key)){
        event.preventDefault();event.stopPropagation();
        index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
        tabs[index].focus();tabs[index].click();
      }else if(['Enter',' '].includes(event.key))event.stopPropagation();
    });
    canvas.addEventListener('click',event=>{
      const status=event.target.closest('[data-process-status]');if(!status)return;
      const diagram=status.closest('.process-schematic'),history=diagram.querySelector('[data-process-history]');
      const open=history.hidden;diagram.dataset.historyPinned=String(open);history.hidden=!open;status.setAttribute('aria-expanded',String(open));
    });
    previous.addEventListener('click',()=>show(current-1));
    next.addEventListener('click',()=>show(current+1));
    document.addEventListener('keydown',event=>{
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();show(current+1)}
      if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();show(current-1)}
      if(event.key==='Home'){event.preventDefault();show(0)}
      if(event.key==='End'){event.preventDefault();show(pages.length-1)}
    });
    window.addEventListener('hashchange',()=>{const index=fromHash();if(index>=0)show(index,false)});
    window.addEventListener('message',event=>{
      const frame=Array.from(canvas.querySelectorAll('iframe[data-scene]')).find(item=>item.contentWindow===event.source);
      if(!frame||frame.dataset.scene!==event.data?.scene)return;
      const page=frame.closest('.slide');
      if(event.data.type==='catpaw:greeting-state'&&frame.dataset.scene==='1.3-2'&&page.classList.contains('active')&&typeof event.data.greeting==='string'&&Array.from(event.data.greeting).length<=12)sharedGreetingText=event.data.greeting;
      if(event.data.type==='catpaw:scene-ready'){
        frame.dataset.connected='true';
        const requested=page.classList.contains('active')&&frame.dataset.requestedFrame!==undefined;
        frame.contentWindow.postMessage({type:requested?'catpaw:scene-seek':page.classList.contains('active')?'catpaw:scene-activate':'catpaw:scene-preview',scene:frame.dataset.scene,greetingText:sharedGreetingText,...(requested?{frame:Number(frame.dataset.requestedFrame)}:{})},'*');
      }
      if(event.data.type==='catpaw:scene-progress'&&frame.dataset.processSync==='true'&&page.classList.contains('active')&&!document.hidden){
        if(frame.dataset.requestedFrame!==undefined&&Number(frame.dataset.requestedFrame)!==event.data.frame)return;
        delete frame.dataset.requestedFrame;
        syncProcessDiagram(page,event.data.frame,event.data.activity,event.data.status,event.data.tools);
      }
      if(event.data.type==='catpaw:scene-prepared'){
        frame.dataset.prepared='true';
        fitDemo(page);revealDemo(page);
      }
      if(event.data.type==='catpaw:scene-key'&&page.classList.contains('active')){
        if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.data.key))show(current+1);
        if(['ArrowLeft','ArrowUp','PageUp'].includes(event.data.key))show(current-1);
        if(event.data.key==='Home')show(0);
        if(event.data.key==='End')show(pages.length-1);
      }
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)pages[current]?.querySelectorAll('.process-schematic').forEach(clearProcessToolTransfer);
      pages[current]?.querySelectorAll('iframe[data-scene]').forEach(frame=>{
        if(frame.dataset.connected==='true')frame.contentWindow.postMessage({type:document.hidden?'catpaw:scene-deactivate':'catpaw:scene-activate',scene:frame.dataset.scene,greetingText:sharedGreetingText},'*');
      });
    });
    window.addEventListener('beforeprint',()=>pages.forEach(fitDemo));
    pages.forEach(page=>page.querySelectorAll('.demo-viewport iframe').forEach(frame=>{
      frame.addEventListener('load',()=>{frame.dataset.loaded='true';fitDemo(page);revealDemo(page)});
    }));
    new ResizeObserver(fit).observe(stage);
    fit();show(current,false);
  </script>
</body>
</html>
