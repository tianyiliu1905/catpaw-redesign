  <title>CatPaw · 设计策略</title>
  <style>
    :root{color-scheme:light;--black:#111;--gray:#575757;--muted:#777;--line:#d8d8d8;--paper:#fafafa;--surround:#fafafa;--action-title-size:18px;--detail-label-size:10.8px;--detail-body-size:14.4px;--detail-copy-width:320px;--detail-demo-width:884px}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--black)}
    body{background:var(--surround)}
    button{font:inherit}
    button:focus-visible{outline:2px solid var(--black);outline-offset:3px}
    .shell{min-height:100dvh;display:grid;grid-template-rows:1fr auto;gap:12px;padding:24px}
    .stage{position:relative;align-self:center;justify-self:center;width:min(1440px,calc(100vw - 48px),calc((100dvh - 112px)*16/9));aspect-ratio:16/9;background:var(--paper);box-shadow:0 12px 38px #00000012;overflow:hidden}
    .canvas{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(var(--scale,1));transform-origin:top left}
    .slide{position:absolute;inset:0;display:none;padding:0 48px 40px;background:var(--paper)}
    .slide.active{display:flex;flex-direction:column}
    .slide.preparing{visibility:hidden}
    .topline{position:relative;display:flex;flex:none;line-height:16px;align-items:center;justify-content:space-between;padding-bottom:13px;font-size:11.7px;font-weight:600;letter-spacing:.025em}
    .deck-progress{position:absolute;top:-1px;left:178px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:780px;letter-spacing:0}
    .deck-progress-step{display:block;color:#aaa;font-size:9.9px;font-weight:400;line-height:14px}
    .deck-progress-step.is-current{color:var(--black);font-weight:650}
    .deck-progress-step.is-complete{color:#aaa}
    .deck-progress-track{display:block;height:2px;margin-top:5px;background:#e6e6e6;overflow:hidden}
    .deck-progress-fill{display:block;width:var(--phase-progress,0%);height:100%;background:#ccc}
    .deck-progress-step.is-current .deck-progress-fill{background:var(--black)}
    .deck-points{position:absolute;top:31px;left:178px;width:780px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;font-size:9px;font-weight:400;letter-spacing:0}

    .deck-point-group.is-current a{color:#575757}
    .deck-points a{color:#999;text-decoration:none;white-space:nowrap}

    .deck-points a[aria-current="step"]{font-weight:650}
    .topline .right{color:var(--gray);font-weight:400;font-variant-numeric:tabular-nums}
    .mainline{margin-top:24px;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:12px;row-gap:6px;color:var(--gray);font-size:12.6px;line-height:1.6;flex-shrink:0}
    .mainline .number{flex:0 0 24px;font-weight:700;color:var(--black)}
    .mainline>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
    .mainline .status{margin-left:auto;font-size:10.8px;color:var(--gray)}
    h1,h2,h3,p{margin:0}
    h1{margin-top:22px;max-width:1128px;font-size:36px;font-weight:680;line-height:1.22;letter-spacing:-.045em}
    .body{display:grid;grid-template-columns:36% minmax(0,1fr);gap:52px;flex:1;min-height:0;margin-top:43px}
    .action-slide .mainline,.action-slide h1{max-width:var(--detail-copy-width)}
    .action-slide .mainline .status{margin-left:0;flex-basis:100%;white-space:nowrap}
    .action-slide .body{display:block;margin-top:30px}
    .action-slide .left-content{width:var(--detail-copy-width);padding-top:12px}
    .action-slide .user-concern{margin-bottom:14px;padding-bottom:10px}
    .action-slide .design-slot{position:absolute;top:60px;right:0px;bottom:40px;width:var(--detail-demo-width)}
    .action-slide .design-slot.has-demo{bottom:84px}
    .left-content{padding-top:22px;min-width:0}
    .label{font-size:var(--detail-label-size);letter-spacing:.08em;color:var(--muted);font-weight:620}
    .actions{border-top:0.5px solid var(--line);padding-top:20px;margin-top:34px;min-width:0}
    .action-list{margin-top:9px}
    .action{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:0.5px solid var(--line)}
    .action:last-child{border-bottom:0}
    .action-no{font-size:10.8px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
    .action h3{font-size:13.5px;line-height:1.44;font-weight:600}
    .action-detail{min-width:0}
    .user-concern{display:block;margin-bottom:18px;padding-bottom:15px}
    .user-concern .label{display:block}
    .user-concern p{margin-top:14px;color:var(--gray);font-size:var(--action-title-size);line-height:1.5;font-weight:650}
    .action-detail h3{margin-top:14px;font-size:var(--action-title-size);line-height:1.5;font-weight:650}
    .action-detail p{margin-top:12px;font-size:var(--detail-body-size);line-height:1.75;color:var(--gray)}
    .feedback-component-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:var(--detail-body-size);line-height:1.5;color:var(--gray)}
    .feedback-component-table th,.feedback-component-table td{text-align:left;padding:8px 0;border-bottom:0.5px solid var(--line);vertical-align:top}
    .feedback-component-table thead th{font-weight:500;color:var(--muted)}
    .feedback-component-table tbody th{width:32%;font-weight:500;color:var(--ink);white-space:nowrap;padding-right:12px}
    .design-slot{display:flex;flex-direction:column;min-width:0;min-height:0;margin:0;border:0.5px solid var(--line)}
    .design-slot.has-demo{border:0}
    #slide-3\.1-analysis .design-slot{border:0;box-shadow:none}
    .design-slot-body{display:grid;place-items:center;flex:1;min-height:0;color:#aaa;font-size:14.4px}
    .demo-slot-body{display:block;overflow:hidden;background:#bde5e8 url('./assets/demo-wallpaper.png') center / cover no-repeat}
    .demo-viewport{position:relative;width:100%;height:100%;overflow:hidden}
    .demo-viewport iframe{position:absolute;width:1200px;height:800px;border:0;transform-origin:top left;pointer-events:none;visibility:hidden}
    .demo-viewport iframe.is-ready{visibility:visible}
    .phase-demo-context{position:absolute;top:88px;left:430px;right:48px}
    .phase-demo-context .user-concern{margin-bottom:12px;padding-bottom:12px}
    .phase-demo-context .user-concern p{margin-top:8px}
    .phase-demo-context .action-detail h3{margin-top:8px}
    .phase-demo-context .action-detail p{margin-top:9px}
    .phase-demo-grid{position:absolute;top:300px;right:48px;bottom:28px;left:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .phase-demo-card{display:flex;flex-direction:column;min-width:0;min-height:0;margin:0}
    .phase-demo-card figcaption{display:flex;align-items:baseline;gap:10px;min-height:39px}
    .phase-demo-card figcaption strong{font-size:15.3px;font-weight:650}
    .phase-demo-card figcaption span{color:var(--muted);font-size:10.8px}
    .phase-demo-card .demo-viewport{flex:1;min-height:0;height:auto;border:0.5px solid var(--line);border-radius:12px;background:var(--paper)}
    .phase-demo-card iframe{width:600px;height:620px}
    .process-pair{position:absolute;top:284px;right:48px;bottom:60px;left:48px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .process-pair-panel{display:flex;flex-direction:column;min-width:0;min-height:0;margin:0}
.process-research-slide .mainline,.process-research-slide h1{max-width:var(--detail-copy-width)}
.process-research-slide .phase-demo-context{top:230px;left:48px;right:auto;width:var(--detail-copy-width)}
.process-research-slide .phase-demo-context .user-concern{margin-bottom:22px}
.process-research-slide .process-pair{top:96px;right:0px;bottom:84px;left:auto;width:var(--detail-demo-width);grid-template-columns:minmax(0,3fr) minmax(0,5fr);gap:20px}
.process-research-slide .process-pair-panel figcaption{min-height:34px;flex-wrap:wrap;align-content:flex-start;align-items:baseline;justify-content:center;text-align:center;gap:8px}
.process-research-slide .process-pair{grid-template-rows:auto minmax(0,1fr)}
.process-research-slide .process-pair::after{content:"";grid-area:2 / 1 / 3 / -1;border:0.5px solid var(--line);pointer-events:none}
.process-research-slide .process-pair-panel{grid-row:2;margin:12px}
.process-research-slide .process-pair-panel:first-of-type{grid-column:1;margin-right:0}
.process-research-slide .process-pair-panel:last-of-type{grid-column:2;margin-left:0}
.process-pair>.process-header{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;text-align:center}
    .process-header .process-tabs{flex:none;margin:0}
.process-research-slide .process-pair-panel .demo-viewport{border:0;border-radius:0;background:transparent}
[data-process-plan]{padding:6px 0;border-bottom:0.5px solid var(--line);font-size:11.7px;line-height:1.7}
[data-process-plan][hidden]{display:none}

    .process-pair-panel figcaption{display:flex;align-items:baseline;gap:12px;min-height:34px;font-size:14.4px;font-weight:650}
    .process-pair-panel figcaption span{color:var(--muted);font-size:10.8px;font-weight:400}
    .process-pair-panel .demo-viewport{flex:1;min-height:0;border:0.5px solid var(--line);border-radius:10px;background:#fff}
    .process-pair-panel iframe{width:660px;height:500px}
    .process-schematic{--process-intent-height:70px;--process-block-gap:6px;--process-plan-compact-height:48px;position:relative;overflow:hidden;display:flex;flex:1;flex-direction:column;min-height:0;padding:16px 0 0}
    .process-tabs{display:inline-flex;align-items:center;gap:4px;border-bottom:0.5px solid var(--line)}
    .process-tabs button{margin-bottom:-1px;padding:5px 8px;border:0;border-bottom:0.5px solid transparent;background:transparent;color:var(--muted);font-size:14.4px;line-height:1.5;cursor:pointer}
    .process-tabs button[aria-selected="true"]{border-color:var(--black);color:var(--black);font-weight:650}
.process-map-status{display:block;position:relative;background:transparent;text-align:left;cursor:pointer;width:min(100%,440px);min-height:22px;margin:0 auto 8px;padding:7px 32px 7px 10px;border:0;border-bottom:0.5px solid #f2f2f2;border-radius:0;color:var(--muted);font-size:12.6px;line-height:1.5}
    .process-map-status::after{content:"";position:absolute;right:13px;top:12px;width:7px;height:7px;border-right:0.5px solid currentColor;border-bottom:0.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
    .process-map-status[aria-expanded="true"]::after{transform:rotate(45deg)}
    .process-map-history{position:absolute;top:57px;left:50%;z-index:5;width:min(100%,440px);max-height:220px;overflow:auto;padding:7px 10px;border:0.5px solid var(--line);background:#fff;transform:translateX(-50%);box-shadow:0 5px 15px #0000000d}
    .process-map-history[hidden]{display:none}
    .process-map-history ol{margin:0;padding:0;list-style:none}
    .process-map-history li{padding:6px 0;color:var(--gray);font-size:11.7px;line-height:1.5}
    .process-map-history li::before{content:"✓";margin-right:10px;color:var(--muted)}
    .process-map-tools.is-idle{visibility:hidden}
    .process-tool-transfer{position:absolute!important;z-index:6;flex-direction:column;gap:5px;min-height:0;pointer-events:none;transform-origin:top left}
    .process-tool-transfer small{font-size:9.9px;font-weight:400}
    .process-map-columns{position:relative;flex:1;min-height:0}
    .process-map-column{width:min(100%,440px);margin:0 auto}
    .process-map-column[hidden],.process-map-column:not(.is-current){display:none}
    .process-map-body{display:flex;flex-direction:column;gap:var(--process-block-gap);padding-top:12px}
    .process-map-block{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:10px 6px;background:#e6e6e6;color:var(--black);font-size:11.7px;font-weight:600;line-height:1.5;text-align:center}
    .process-map-intent,.process-map-plan{min-height:var(--process-intent-height)}
.process-map-history,.process-map-block{border-radius:12px}
    .process-schematic[data-phase="before"][data-initial-step="intent"] .process-map-plan{visibility:hidden}
    .process-schematic[data-phase="before"][data-initial-step="planning"] .process-map-plan{animation:processMapResult .45s ease-out both}
    .process-map-plan-compact{min-height:var(--process-plan-compact-height);background:#f3f3f3;color:var(--muted)}
    .process-map-tools{min-height:126px;flex-direction:column;gap:5px}
    .process-map-tools small{font-size:9.9px;font-weight:400}
    .process-map-folded{height:14px;padding:0;background:#f3f3f3}
    .process-map-result{min-height:180px}
    .process-map-column.is-current .process-map-tools::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,#ffffff99 50%,transparent 80%);transform:translateX(-100%);animation:processMapSweep 2s ease-in-out infinite}
    .process-map-column.is-current .process-map-result{animation:processMapResult .5s ease-out both}
    .process-map-caption{min-width:0;width:100%;margin:0;font-size:12.6px;line-height:1.5;color:var(--gray)}
    .process-schematic[data-transition="before-working"] .process-map-column[data-phase="before"]{position:absolute;top:0;left:50%;z-index:1;display:block;transform:translateX(-50%);pointer-events:none}
    .process-schematic[data-transition="before-working"] .process-map-column[data-phase="before"] .process-map-plan{visibility:hidden}
    .process-schematic[data-transition="before-working"] .process-map-intent{animation:processIntentExit .42s ease-in both}
    .process-schematic[data-transition="before-working"] .process-map-column[data-phase="working"]{position:relative;z-index:2}
    .process-schematic[data-transition="before-working"] .process-map-plan-compact{animation:processPlanMove .76s cubic-bezier(.22,.68,0,1) both}
    .process-schematic[data-transition="before-working"] .process-map-tools{animation:processToolsEnter .42s .72s cubic-bezier(.22,.68,0,1) both}
    @keyframes processIntentExit{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-120%)}}
    @keyframes processPlanMove{0%{transform:translateY(calc(var(--process-intent-height) + var(--process-block-gap)));height:var(--process-intent-height);background:#e6e6e6;color:var(--black)}55%{transform:translateY(0);height:var(--process-intent-height);background:#e6e6e6;color:var(--black)}100%{transform:translateY(0);height:var(--process-plan-compact-height);background:#f3f3f3;color:var(--muted)}}
    @keyframes processToolsEnter{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
    @media(prefers-reduced-motion:reduce){.process-schematic[data-transition="before-working"] .process-map-column[data-phase="before"]{display:none}.process-schematic[data-transition="before-working"] :is(.process-map-intent,.process-map-plan-compact,.process-map-tools){animation:none}}
    @keyframes processMapSweep{to{transform:translateX(100%)}}
    @keyframes processMapResult{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.process-map-column{transition:none}.process-map-column.is-current,.process-map-column.is-current .process-map-tools::after,.process-map-column.is-current .process-map-result,.process-schematic[data-phase="before"] .process-map-column .process-map-plan{animation:none}}
    .layout-demo-slide .mainline,.layout-demo-slide h1{max-width:var(--detail-copy-width)}

    .genui-choice p{font-size:15.3px;line-height:1.6;margin:4px 0 0;color:var(--gray)}

    .widget-modules h1{font-size:34.2px;margin-top:18px}

    .widget-modules-table th{font-size:12.6px;color:var(--gray);font-weight:500;padding-top:0}
    .widget-modules-table th:first-child,.widget-modules-table td:first-child{width:238px;padding-left:0}

    .widget-modules-table td:first-child{font-weight:650}
    .widget-modules-priority{font-size:15.3px;line-height:1.6;margin:18px 0 0}
    .widget-modules-shared{font-size:12.6px;line-height:1.6;color:var(--gray);margin:10px 0 0}
    .widget-modules .reply-analysis-sources{margin-top:auto}
    /* Compare the original ribbon with the contextual tools used by the demo. */
    .toolbar-comparison{flex:none;padding:0 0 16px;display:grid;gap:14px}
    .toolbar-comparison-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
    .toolbar-comparison-heading strong{font-size:15.3px;font-weight:650}
    .toolbar-comparison-heading span{font-size:11.7px;color:var(--muted)}
    .toolbar-original{display:block;width:100%;height:auto;border-radius:8px}
    .toolbar-current{display:flex;align-items:center;gap:16px}
    .toolbar-current-state{flex:none;font-size:11.7px;color:var(--muted)}
    .toolbar-context-preview{display:flex;align-items:center;gap:14px;padding:10px 14px;border:0.5px solid var(--line);border-radius:12px;background:#fff;font-size:12.6px;white-space:nowrap}
    .toolbar-context-preview img{width:18px;height:18px;object-fit:contain}
    .toolbar-context-preview .toolbar-separator{height:22px;width:1px;background:var(--line)}
    .toolbar-comparison-caption{font-size:11.7px;color:var(--gray);line-height:1.5;margin-top:8px}
    #slide-3\.2 .demo-slot-body{border-radius:10px}
    .slide .design-slot,
    .slide .phase-demo-card .demo-viewport{box-shadow:0 2px 6px rgba(0,0,0,.025),0 8px 24px rgba(0,0,0,.045)}
    .interruption-action-slide .left-content{position:absolute;top:150px;left:48px;width:544px;padding:0;display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
    .interruption-action-slide .user-concern p,.interruption-action-slide .action-detail h3{font-size:15px;margin-top:8px}
    .interruption-action-slide .action-detail p{font-size:12.6px;line-height:1.6;margin-top:8px}
    .interruption-action-slide .design-slot{width:640px}
    .interruption-route-map{position:absolute;left:48px;top:270px;bottom:90px;width:544px;margin:0;display:flex;flex-direction:column}
    .interruption-route-map figcaption{font-size:12px;line-height:1.5;color:#21835b;margin-bottom:12px}
    .interruption-route-map .interruption-flowchart{width:100%;height:100%;min-height:0;margin:0;flex:1}
    .interruption-route-map .flow-node{stroke:#ddd;fill:none}
    .interruption-route-map text{fill:#aaa}
    .interruption-route-map path[data-flow-routes]{stroke:#ddd}
    .interruption-route-map [data-flow-active="true"] .flow-node{stroke:#21835b;fill:#edf7f1}
    .interruption-route-map [data-flow-active="true"] text,.interruption-route-map text[data-flow-active="true"]{fill:#21835b}
    .interruption-route-map path[data-flow-active="true"]{stroke:#21835b}
    .slide h1 .title-status{font-size:.5em;font-weight:400;white-space:nowrap}
    /* Reserve bold weight for each slide's main heading. */
    .slide :not(h1):not(h1 *){font-weight:400!important}
    .slide h1 *{font-weight:inherit}

<body>
  <div class="shell">
    <main class="stage" aria-label="CatPaw 设计策略宽屏演示文稿">
      <div class="canvas" id="canvas"></div>
    </main>
  </div>
  <script src="./strategy-scenes.js"></script>
  <script src="./strategy-journal.js"></script>
  <script>
    const pointSlides = [
      {
        no:'1.1', strategy:'策略一 · 降低启动门槛，建立正确预期', title:'能力可感：用熟悉的任务与产物，让用户看懂 Agent 能做什么。',
        thesis:'先让用户认出可以委托的任务，以及可能得到的成果类型。',
        question:'“我手头这些事，哪些能交给它做？”',
        context:'初次使用者更容易理解熟悉的任务和产物类型；首屏堆叠太多文字与具体案例，反而会增加理解负担。四类入口依据 ToC 与 ToB 的真实任务类型归并，但不等同于统计分类。',
        actions:[
          ['用四类任务入口说明能力与产物','将常见工作与成果并列呈现；短说明帮助用户选方向，具体成品留到案例区。']
        ], check:'用户能说出至少一种可委托的任务，以及可能得到的产物类型。'
      },
      {
        no:'1.2', strategy:'策略一 · 降低启动门槛，建立正确预期', title:'预期可管：从案例看清结果，建立产物预期。',
        thesis:'通过相关案例和完整成品，帮助用户判断结果是否适合自己的任务。',
        question:'“做出来的东西，够不够我实际用？”',
        context:'认识能力后，用户仍需要看到具体结果，确认产物质量与自己的任务是否匹配。借用案例做法、改写并发起任务，从上手可启开始展开。',
        actions:[
          ['按任务方向提供案例，直接查看成品','选择任务方向后展示相关案例，卡片预览产物样貌；点开即可查看完整成品，帮助用户判断质量与任务是否匹配，建立结果预期。']
        ], check:'用户能看清成品，判断质量与自己的任务是否匹配，形成结果预期。'
      },
      {
        no:'1.3', strategy:'策略一 · 降低启动门槛，建立正确预期', title:'上手可启：借用案例起点与主动接话，帮助用户发起任务。',
        thesis:'从看懂案例过渡到借用做法，再通过主动接话，帮助用户发起任务。',
        question:'“想试试，但第一句话该怎么说？”',
        context:'看过案例之后，用户需要可借用、可改写的起点；直接输入时，也需要轻量接话，逐步补充目标、材料和要求。',
        actions:[
          ['交代做法，提供可改写的起点','鼠标依次指向案例中的 Skill 与原始 Prompt，再点击“做同款”。案例预览、Skill 与 Prompt 一起带回输入区，成为用户可继续改写的起点。'],
          ['聚焦时主动问候','聚焦输入框时，标题切换为亲切的问候语，邀请用户先说一个方向。'],
          ['选任务标签后接具体话题','选择“设计与创作”后，欢迎语随任务方向变化；进一步选择“制作汇报 PPT”等标签，欢迎语聚焦具体话题，帮助用户表达需求。']
        ], check:'用户不必先写出完整 Prompt，也能顺利发起第一轮任务。'
      },
      {
        no:'2.1', strategy:'策略二 · 构建对话闭环，保障透明可控', title:'过程可懂：按任务阶段与用户需要调整信息披露。',
        thesis:'先讲清当前进展，再按需提供更深的执行细节。',
        question:'“它是不是按我的意思在做，做到哪儿了？”',
        context:'为降低办公用户的理解门槛，默认折叠技术细节与历史过程，按阶段突出重点；同时保留研发模式，回应仍然存在的研发与深度用户需求。',
        research:{title:'按任务阶段切换信息重点',concern:'“它是不是按我的意思在做，做到哪儿了？”',body:'面向办公用户降低理解门槛，研究各阶段最需要的信息：工作前确认意图与安排，工作时突出当前执行，结束后呈现文字、产物与本轮变化，迭代修改可撤回。后续设计分别回应这三个阶段。'},
        actions:[
          ['工作前：确认意图与任务规划','收到任务即显示全局响应与计时，先复述目标、产物与关键约束，再展开完整待办。让用户确认任务已被接住，并检查理解与推进安排。'],
          ['工作时：语义化呈现工具执行过程','将工具执行转译为用户能理解的任务描述，说明正在处理什么、要解决什么问题，降低理解成本。持续展示全局状态，每组完成后留下阶段总结；技术细节与历史过程按需展开。'],
          ['结束后：呈现文字、产物与变化','停止计时，呈现简短结论、可打开的产物与本轮变化。待办和执行过程收进全局状态，展开可回看；迭代后支持撤回本轮修改，恢复上一版本。']
        ], check:'不同用户都能快速判断任务是否按预期推进，并按需核对执行依据。'
      },
      {
        no:'2.2', strategy:'策略二 · 构建对话闭环，保障透明可控', title:'过程可控：随时暂停、补充与引导。',
        thesis:'让用户能按需要暂停、补充要求，并承接已有内容继续。',
        question:'“做着做着发现要求没说对，还来得及改吗？”',
        context:'执行中用户可能发现方向不对、想起遗漏条件，或需要先停下来判断；提供暂停、继续与队列引导，降低中途调整的成本。',
        interruptionResearch:{
          title:'打断之后，怎样继续？',
          intro:'先判断是否需要暂停，再根据是否有新要求继续；消息是否入队，取决于发送时任务是否仍在执行。',
          scenarios:[
            {title:'方向不对，已经想好怎么改',reason:'希望立刻调整当前执行方向',route:['暂停','输入新要求','发送并继续']},
            {title:'还没想好，先停下来判断',reason:'需要阅读、核对，或重新考虑要求',route:['暂停','阅读与思考','继续或补充']},
            {title:'补充不急，当前步骤可以继续',reason:'想起遗漏条件，接受稍后再处理',route:['输入补充','加入队列','稍后发送']}
          ],
          states:[['执行中','空','暂停','停住当前任务'],['执行中','有内容','发送／入队','暂存补充，当前执行继续'],['已暂停','空','继续','开启新一轮，沿用原要求'],['已暂停','有内容','发送并继续','新一轮按补充要求推进']],
          feedback:'保留当前输出、进度和展开状态，暂停计时与推进。文案颜色缓慢呼吸，无需立即填写修改意见。',
          queueRule:'队列消息可以点“引导”立即发送，重新发起思考与执行。其他待发送消息仍保留。',
          continuity:'内部重新发起推理与执行，界面仍承接已有内容，让用户感到是在暂停、继续和引导同一项工作。',
          experienceGoal:'降低打断的心理负担，鼓励用户及时补充和纠偏，帮助 Agent 给出更符合预期的回复。',
        },
        actions:[
          ['暂停保留现场，随时接着做','暂停后保留输出与进度；点击继续，沿用上下文接着做。'],
          ['暂停后补充要求，直接调整方向','暂停后补充要求，点击“发送并继续”，按新要求调整后续执行。'],
          ['先排队补充，也可立即引导','补充先进入队列，当前执行继续；点击“引导”立即发送，按新要求重新思考。'],
        ], check:'用户能随时暂停、补充和引导，并沿用已有上下文继续任务。'
      },
      {
        no:'2.3', strategy:'策略二 · 构建对话闭环，保障透明可控', title:'异常可恢复：说明受阻原因，保留成果并提供继续路径。',
        thesis:'区分需要用户反馈、系统自行恢复和当前无法继续，让下一步明确可见。',
        question:'“怎么不往下做了，我还要等多久？”',
        context:'任务受阻时，用户需要知道原因、已保留的成果和继续方式。信息或授权缺失时等待用户反馈；暂时故障时有限重试；确实无法完成时说明边界并提供替代选择。',
        recoveryResearch:true,
        actions:[
          ['整理四类组件，降低补充成本','共用底部问题卡片，按信息类型提供：\n单选：确定方向与偏好\n文本输入：补充开放信息\n范围输入：限定预算或时间\n摘要确认：核对目标与约束\n\n授权确认单独呈现，说明可执行的操作与权限范围。'],
          ['系统自行恢复，让重试状态可见','资料服务暂时超时，明确告知正在第几次尝试、哪些工作已保留；恢复后继续受阻步骤。用户可停止重试并稍后重新尝试，无需重复提交任务。'],
          ['明确未完成的边界，由用户选择下一步','缺少视频生成工具时停止无效尝试，通过回复说明视频尚未生成；提供分镜与解说稿作为替代方向，经用户确认后再执行，交付时标明替代内容。']
        ], check:'用户能理解受阻原因、补充所需资料，并确认已完成的工作保留；三类路径均为预设交互原型，真实工具恢复与失败判断仍待接入和验证。'
      },
      {
        no:'2.4', strategy:'策略二 · 构建对话闭环，保障透明可控', title:'结果可视：按用户下一步任务组织回复与交互。',
        thesis:'让用户先看懂答案，再决定是否深入；需要表达偏好时，可以直接选择、填写或勾选。',
        question:'“信息这么多，我该关注什么、怎么选？”',
        context:'回复形式取决于用户接下来要确认、理解、比较，还是补充信息。短回复减少阅读，可视化降低理解成本，交互组件降低表达成本。六类组件已接入供应商对比原型，自动选择与组装规则仍需验证。',
        analysis:{title:'按下一步任务判断回复形式',concern:'“回复看完了，可我还是不知道该怎么选、怎么做。”',premiseTitle:'回答正确，也不一定好用',premise:'简单确认写成长文，比较数据散在段落里，偏好只能靠文字描述，都会增加理解与表达成本。回复还需要适合用户接下来要做的事。',body:'因此，先区分确认答案、理解比较、补充信息三类场景，再选择短回复、可视化呈现或交互控件。'},
        actions:[
          ['提供适配数据结构的表格样式','为明细记录、横向对比与指标差异设计预设表格，统一表头、数字对齐、单位与重点标记。数据按统一结构填入；设计侧可调整预设，自动选型与预设编辑入口仍待实现。'],
          ['用选择与确认降低表达成本','条件可直接修改，呈现偏好可看图选择，跟进事项可勾选，并保留文字补充。选择会带入后续建议；补充要求后可继续更新，也能调整条件重新比较，减少反复交代。']
        ], check:'用户能看懂重点、完成选择，并在下一轮沿用选择与补充要求；自动选用组件的规则仍待真实任务验证。'
      },
      {
        no:'3.1', strategy:'策略三 · 优化产物体验，推动成果落地', status:'待深化', title:'布局可适：让窗口随人和 Agent 的参与状态切换。',
        thesis:'对话、并排、批注与桌宠触达，对应四种不同的人机参与关系。',
        question:'“我得仔细看看做出来的东西，有问题再接着聊。”',
        context:'讨论方向时看对话；核对内容时边看边聊；集中批注时让 Agent 暂退；人暂时离开时，桌宠传达 Agent 的工作状态。',
        actions:[
          ['按人机互动的参与程度适配布局','按讨论方向、边看边聊、专心修改和用户暂离四种状态，调整对话、产物与桌宠的呈现；切换时保留当前任务和修改上下文。']

          ['支持多条意见集中交付','在多个位置留下意见后统一提交，让 Agent 看到每条意见对应的对象，减少一处一轮的反复沟通。']
        ], check:'用户能少打字、少往返，并确认每条意见指向正确内容。'
      },
      {
        no:'3.3', strategy:'策略三 · 优化产物体验，推动成果落地', title:'版本可溯：每轮改动看得见，也回得去。',

          <div class="phase-demo-context">
            <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(actionConcerns[slide.pointNo][slide.actionIndex])}</p></div>
            <div class="action-detail"><span class="label">设计动作 3.1.1</span><h3>${escapeHtml(slide.action[0])}</h3><p>${escapeHtml(slide.action[1])}</p></div>
          </div>
          ${layoutComparisonsDemo}
        </section>`;
      if(slide.no==='2.1')return `
        <section class="slide phase-demo-slide process-research-slide" id="slide-2.1" aria-label="2.1 过程可懂：设计研究与阶段展示分析">
          ${topline(index)}
          <div class="mainline"><span class="number">2.1</span><span>${escapeHtml(slide.strategy)}</span></div>
          <h1>${escapeHtml(pageView[slide.pointNo][0])}</h1>
          <div class="phase-demo-context">
            <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(slide.research.concern)}</p></div>
            <div class="action-detail"><span class="label">设计研究</span><h3>${escapeHtml(slide.research.title)}</h3><p>${escapeHtml(slide.research.body)}</p></div>
          </div>
          ${processDemo}
        </section>`;
      return `
        <section class="slide action-slide${interruptionRoutes[slide.no]?' interruption-action-slide':''}" id="slide-${escapeHtml(slide.no)}" aria-label="${escapeHtml(slide.pointNo+' '+pageView[slide.pointNo][0]+'：'+slide.action[0])}">
          ${topline(index)}
          <div class="mainline"><span class="number">${escapeHtml(slide.pointNo)}</span><span>${escapeHtml(slide.strategy)}</span>${slide.status?`<span class="status">${escapeHtml(slide.status)}</span>`:''}</div>
          <h1>${escapeHtml(pageView[slide.pointNo][0])}${['2.4','3.3'].includes(slide.pointNo)?'<span class="title-status">（设计中）</span>':''}</h1>
          <div class="body">
            <div class="left-content">
              <div class="user-concern"><span class="label">用户关注</span><p>${escapeHtml(actionConcerns[slide.pointNo][slide.actionIndex])}</p></div>
              <div class="action-detail"><span class="label">设计动作 ${escapeHtml(`${slide.pointNo}.${slide.actionIndex+1}`)}</span><h3>${escapeHtml(slide.action[0])}</h3>${slide.pointNo==='2.3'&&slide.actionIndex===0?`<p>共用底部问题卡片，按信息类型提供：</p><table class="feedback-component-table" aria-label="四类补充信息组件"><thead><tr><th scope="col">组件类型</th><th scope="col">适用信息</th></tr></thead><tbody><tr><th scope="row">单选</th><td>确定方向与偏好</td></tr><tr><th scope="row">文本输入</th><td>补充开放信息</td></tr><tr><th scope="row">范围输入</th><td>限定预算或时间</td></tr><tr><th scope="row">摘要确认</th><td>核对目标与约束</td></tr></tbody></table><p>授权确认单独呈现，说明可执行的操作与权限范围。</p>`:`<p>${escapeHtml(slide.action[1])}</p>`}</div>
              ${slide.note&&slide.actionIndex===0?`<p class="design-note">${escapeHtml(slide.note)}</p>`:''}
              ${slide.pointNo==='1.1'&&slide.actionIndex===0?`<p class="capability-source">四类是任务归并，并非统计标签。ToC 首轮 n=3,322；ToB 抽样 n=938。来源：<a href="https://km.sankuai.com/collabpage/2789760458" target="_blank" rel="noopener noreferrer">ToC 报告</a> · <a href="https://km.sankuai.com/collabpage/2786789535" target="_blank" rel="noopener noreferrer">ToB 报告</a></p>`:''}
            </div>
            <figure class="design-slot ${CatPawStrategyScenes.scenes[slide.no]?'has-demo':''}" data-design-slot="${escapeHtml(slide.no)}" aria-label="设计稿：${escapeHtml(pageView[slide.pointNo][1])}">${slide.no==='3.2'?toolbarComparison:''}${CatPawStrategyScenes.scenes[slide.no]?`<div class="design-slot-body demo-slot-body"><div class="demo-viewport"><iframe title="CatPaw Demo：${escapeHtml(slide.action[0])}" data-scene="${escapeHtml(slide.no)}" src="./index.html?strategyScene=${escapeHtml(slide.no)}" tabindex="-1" aria-hidden="true" scrolling="no"></iframe></div></div>`:slide.no==='2.1'?processDemo:slide.no==='2.1-5'?modeDemo:slide.pointNo==='2.2'?`<div class="design-slot-body">${slide.actionIndex===0?'中途干预':'异常恢复'}设计待定</div>`:slide.pointNo==='2.4'?replyTableStylesDemo:slide.pointNo==='3.1'?workspaceDemo[0]:slide.pointNo==='3.3'?`<div class="design-slot-body">版本界面待设计</div>`:`<div class="design-slot-body">对应设计稿放在这里</div>`}</figure>
          </div>
          ${interruptionRoutes[slide.no]?renderInterruptionRoute(slide.no):''}
        </section>`;
    }).join('').replace(/<iframe\b[^>]*>/g,tag=>tag.replace(' src=',' data-src='));

    const pages=[...canvas.querySelectorAll('.slide')];
    const stage=document.querySelector('.stage');
    let sharedGreetingText='';
    const fromHash=()=>{
      const hash=decodeURIComponent(location.hash);
      const canonical=hash==='#2.1-5'?'#2.1':hash==='#3.4'?'#3.3':hash==='#2.2-recovery-analysis'?'#2.3-analysis':hash==='#2.2-4'?'#2.3':hash==='#2.2-5'?'#2.3-2':hash==='#2.2-6'?'#2.3-3':hash==='#1.2-2'?'#1.2':hash==='#1.2-3'?'#1.3':/^#1\.1-[23]$/.test(hash)?'#1.1':hash==='#2.4-4'?'#2.4-3':/^#3\.1-[234]$/.test(hash)?'#3.1':hash==='#3.2-4'?'#3.2':hash==='#3.3-3'?'#3.3-2':hash==='#strategy-4'?'#strategy-3':/^#4(?:-\d+)?$/.test(hash)?'#3.3':hash;
      return slides.findIndex(slide=>'#'+slide.no===canonical);
    };
    let current=Math.max(0,fromHash());
    function fitDemo(page){
      page.querySelectorAll('.demo-viewport').forEach(viewport=>{
        if(!viewport.clientWidth||!viewport.clientHeight)return;
        const frame=viewport.querySelector('iframe');
        const demoWidth=Number(viewport.dataset.demoWidth)||1200;
        const demoHeight=Number(viewport.dataset.demoHeight)||800;
        // Close-ups crop intentionally. Full-window scenes expand their native canvas
        // to the container ratio, so the iframe (including its spotlight) fills every edge.
        const closeUp=['1.3-2','1.3-3'].includes(frame.dataset?.scene);
        const scale=(closeUp?Math.max:Math.min)(viewport.clientWidth/demoWidth,viewport.clientHeight/demoHeight);
        const fittedWidth=closeUp?demoWidth:viewport.clientWidth/scale;
        const fittedHeight=closeUp?demoHeight:viewport.clientHeight/scale;
        frame.style.width=`${fittedWidth}px`;
        frame.style.height=`${fittedHeight}px`;
        frame.style.transform=`scale(${scale})`;
        frame.style.left=closeUp?`${(viewport.clientWidth-demoWidth*scale)/2}px`:'0px';
        frame.style.top=closeUp?`${(viewport.clientHeight-demoHeight*scale)/2}px`:'0px';
      });
    }
    function clearProcessToolTransfer(diagram){
      const effect=diagram.processToolEffect;
      if(!effect)return;
      effect.animations.forEach(animation=>animation.cancel());
      effect.timers.forEach(timer=>clearTimeout(timer));
      effect.ghost?.remove();
      diagram.processToolEffect=null;
      if(diagram.dataset.historyPinned!=='true'){
        diagram.querySelector('[data-process-history]').hidden=true;
        diagram.querySelector('[data-process-status]').setAttribute('aria-expanded','false');
      }
    }
    function syncProcessToolHistory(diagram,frameIndex,tools){
      const history=diagram.querySelector('[data-process-history]');
      if(!history)return;
      const previous=diagram.processToolState;
      const completed=Array.isArray(tools?.completed)?tools.completed:[];
      const current=tools?.current||null;
      diagram.querySelector('[data-process-status]').disabled=completed.length===0;
      const transfer=CatPawStrategyScenes.completedToolTransfer(previous,frameIndex,completed);
      const block=diagram.querySelector('.process-map-tools');
      const source=transfer?{rect:block.getBoundingClientRect(),ghost:block.cloneNode(true)}:null;
      clearProcessToolTransfer(diagram);
      const records=diagram.querySelector('[data-process-completed]');
      records.replaceChildren(...completed.map(item=>{
        const row=document.createElement('li');row.dataset.toolRecord=String(item.id);row.textContent=item.name;return row;
      }));
      diagram.processToolState={frame:frameIndex,current};
      block.classList.toggle('is-idle',!current);
      if(frameIndex===0||completed.length===0){diagram.dataset.historyPinned='false';history.hidden=true;diagram.querySelector('[data-process-status]').setAttribute('aria-expanded','false')}
      if(!source||!source.rect.width||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
      const header=diagram.querySelector('[data-process-status]').getBoundingClientRect();
      const destination={left:source.rect.left,top:header.bottom+6,width:source.rect.width,height:24};
      const origin=diagram.getBoundingClientRect();
      const scale=origin.width/diagram.offsetWidth||1;
      const ghost=source.ghost;
      ghost.className='process-map-block process-tool-transfer';ghost.setAttribute('aria-hidden','true');
      Object.assign(ghost.style,{left:`${(source.rect.left-origin.left)/scale}px`,top:`${(source.rect.top-origin.top)/scale-diagram.clientTop}px`,width:`${source.rect.width/scale}px`,height:`${source.rect.height/scale}px`});
      diagram.append(ghost);
      const animations=[ghost.animate([{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:.6,transform:'translate(0,-18px) scale(.98)',offset:.22},{opacity:0,transform:`translate(${(destination.left-source.rect.left)/scale}px,${(destination.top-source.rect.top)/scale}px) scale(${destination.width/source.rect.width},${destination.height/source.rect.height})`}],{duration:650,easing:'cubic-bezier(.22,.68,0,1)',fill:'forwards'})];
      if(current)animations.push(block.animate([{opacity:0,transform:'translateX(40px)'},{opacity:1,transform:'translateX(0)'}],{delay:650,duration:320,fill:'backwards',easing:'ease-out'}));
      const effect={animations,ghost,timers:[]};diagram.processToolEffect=effect;
      effect.timers.push(setTimeout(()=>{if(diagram.processToolEffect===effect)ghost.remove()},650));

    }
    function syncProcessDiagram(page,frameIndex,activity='',status='',tools=null){
      const phase=CatPawStrategyScenes.processPhaseForFrame(frameIndex);
      const diagram=page.querySelector('.process-schematic');
      if(!phase||!diagram)return;
      if(typeof diagram.animate==='function')syncProcessToolHistory(diagram,frameIndex,tools);
      const changed=diagram.dataset.phase!==phase;
      if(changed)diagram.dataset.transition=diagram.dataset.phase==='before'&&phase==='working'?'before-working':'';
      diagram.dataset.phase=phase;
      diagram.querySelector('[data-process-plan]').hidden=phase!=='after';
      if(phase==='after')diagram.querySelector('[data-process-status]').disabled=false;
      const statusLabel=typeof status==='string'&&status?status:{before:'思考中',working:'生成中',after:'已完成'}[phase];
      // Reveal the plan when the live demo starts planning, keeping both views in sync.
      diagram.dataset.initialStep=phase==='before'&&statusLabel==='正在制定计划'?'planning':'intent';
      const statusElement=diagram.querySelector('[data-process-status]');
      statusElement.textContent='全局响应状态';
      statusElement.setAttribute('aria-label',`全局响应状态：${statusLabel}`);
      page.querySelectorAll('.process-map-column').forEach(column=>{
        column.hidden=column.dataset.phase!==phase;
        column.setAttribute('aria-hidden',String(column.hidden));
        column.classList.toggle('is-current',!column.hidden);
        if(column.dataset.phase===phase)column.setAttribute('aria-current','step');else column.removeAttribute('aria-current');
      });
      page.querySelectorAll('[data-process-frame]').forEach(tab=>{
        const selected=CatPawStrategyScenes.processPhaseForFrame(Number(tab.dataset.processFrame))===phase;
        tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;
      });
      if(changed||frameIndex===0)page.querySelector('.process-map-caption').textContent={before:'先确认理解与目标，展示任务规划。',working:'任务规划收成一行，突出当前工具调用，保留阶段总结。',after:'收起过程信息，直接呈现文字、产物与变化，修改可撤回。'}[phase];
      diagram.querySelector('[data-process-tool]').textContent=phase==='working'&&typeof activity==='string'&&activity?activity:'突出当前执行';
    }
    function revealDemo(page){
      page.querySelectorAll('.demo-viewport iframe').forEach(frame=>{
        if(frame.dataset.prepared!=='true')return;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          if(frame.dataset.prepared==='true')frame.classList.add('is-ready');
        }));
      });
    }
    function ensureFrames(page){
      page.querySelectorAll('iframe[data-src]').forEach(frame=>{
        if(!frame.hasAttribute('src'))frame.src=frame.dataset.src;
      });
    }
    function activate(index){
      pages[current]?.querySelectorAll('.process-schematic').forEach(clearProcessToolTransfer);
      pages[current]?.querySelectorAll('.demo-viewport iframe').forEach(frame=>{
        frame.contentWindow?.postMessage({type:'catpaw:scene-deactivate',scene:frame.dataset.scene},'*');
      });
      current=Math.max(0,Math.min(pages.length-1,index));
      if(document.activeElement?.matches('iframe')){
        stage.setAttribute('tabindex','-1');
        stage.focus({preventScroll:true});
      }
      const page=pages[current];
      // Load only the current scene and its neighbours for the current turn.
      pages.forEach((item,i)=>{
        if(Math.abs(i-current)<=1)ensureFrames(item);
        else item.querySelectorAll('iframe[src]').forEach(frame=>{
          frame.removeAttribute('src');frame.classList.remove('is-ready');
          delete frame.dataset.connected;delete frame.dataset.prepared;delete frame.dataset.loaded;
        });
        item.inert=i!==current;
      });
      page.classList.add('preparing');
      const frames=page.querySelectorAll('.demo-viewport iframe');
      frames.forEach(frame=>{frame.classList.remove('is-ready');delete frame.dataset.prepared;delete frame.dataset.requestedFrame;});
      pages.forEach((page,i)=>page.classList.toggle('active',i===current));
      fitDemo(page);
      if(slides[current].no==='2.1')syncProcessDiagram(page,0);
      page.classList.remove('preparing');
      frames.forEach(frame=>{
        if(frame.dataset.connected==='true')frame.contentWindow.postMessage({type:'catpaw:scene-activate',scene:frame.dataset.scene,greetingText:sharedGreetingText},'*');
      });
      revealDemo(page);
      document.title=`${slides[current].kind==='action'?slides[current].pointNo+' '+slides[current].action[0]:slides[current].title} · CatPaw 设计策略`;
      history.replaceState(null,'','#'+slides[current].no);
    }
    canvas.addEventListener('click',event=>{
      const tab=event.target.closest('[data-process-frame]');
      if(!tab)return;
      const page=tab.closest('.slide');
      if(!page.classList.contains('active'))return;
      const frame=page.querySelector('iframe[data-process-sync]');
      const target=Number(tab.dataset.processFrame);
      if(!CatPawStrategyScenes.processPhaseForFrame(target))return;
      frame.dataset.requestedFrame=String(target);
      if(frame.dataset.connected==='true')frame.contentWindow.postMessage({type:'catpaw:scene-seek',scene:frame.dataset.scene,frame:target},'*');
    });
    canvas.addEventListener('keydown',event=>{
      if(event.target.closest('[data-process-status]')&&['Enter',' '].includes(event.key)){event.stopPropagation();return}
      const tab=event.target.closest('[data-process-frame]');
      if(!tab)return;
      const tabs=[...tab.closest('[data-process-tabs]').querySelectorAll('[data-process-frame]')];
      let index=tabs.indexOf(tab);
      if(['ArrowRight','ArrowLeft','Home','End'].includes(event.key)){
        event.preventDefault();event.stopPropagation();
        index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
        tabs[index].focus();tabs[index].click();
      }else if(['Enter',' '].includes(event.key))event.stopPropagation();
    });
    canvas.addEventListener('click',event=>{
      const status=event.target.closest('[data-process-status]');if(!status)return;
      const diagram=status.closest('.process-schematic'),history=diagram.querySelector('[data-process-history]');
      const open=history.hidden;diagram.dataset.historyPinned=String(open);history.hidden=!open;status.setAttribute('aria-expanded',String(open));
    });
    document.addEventListener('keydown',event=>{
      if(event.target.closest('input,textarea,select,button,a,[contenteditable=true]'))return;
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();journal.seek(current+1)}
      if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();journal.seek(current-1)}
      if(event.key==='Home'){event.preventDefault();journal.seek(0)}
      if(event.key==='End'){event.preventDefault();journal.seek(pages.length-1)}
    });
    window.addEventListener('hashchange',()=>{const index=fromHash();if(index>=0)journal.seek(index)});
    window.addEventListener('message',event=>{
      const frame=Array.from(canvas.querySelectorAll('iframe[data-scene]')).find(item=>item.contentWindow===event.source);
      if(!frame||!frame.hasAttribute('src')||frame.dataset.scene!==event.data?.scene)return;
      const page=frame.closest('.slide');
      if(event.data.type==='catpaw:greeting-state'&&frame.dataset.scene==='1.3-2'&&page.classList.contains('active')&&typeof event.data.greeting==='string'&&Array.from(event.data.greeting).length<=12)sharedGreetingText=event.data.greeting;
      if(event.data.type==='catpaw:scene-ready'){
        frame.dataset.connected='true';
        const requested=page.classList.contains('active')&&frame.dataset.requestedFrame!==undefined;
        frame.contentWindow.postMessage({type:requested?'catpaw:scene-seek':page.classList.contains('active')?'catpaw:scene-activate':'catpaw:scene-preview',scene:frame.dataset.scene,greetingText:sharedGreetingText,...(requested?{frame:Number(frame.dataset.requestedFrame)}:{})},'*');
      }
      if(event.data.type==='catpaw:scene-progress'&&frame.dataset.processSync==='true'&&page.classList.contains('active')&&!document.hidden){
        if(frame.dataset.requestedFrame!==undefined&&Number(frame.dataset.requestedFrame)!==event.data.frame)return;
        delete frame.dataset.requestedFrame;
        syncProcessDiagram(page,event.data.frame,event.data.activity,event.data.status,event.data.tools);
      }
      if(event.data.type==='catpaw:scene-prepared'){
        frame.dataset.prepared='true';
        fitDemo(page);revealDemo(page);
      }
      if(event.data.type==='catpaw:scene-key'&&page.classList.contains('active')){
        if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.data.key))journal.seek(current+1);
        if(['ArrowLeft','ArrowUp','PageUp'].includes(event.data.key))journal.seek(current-1);
        if(event.data.key==='Home')journal.seek(0);
        if(event.data.key==='End')journal.seek(pages.length-1);
      }
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)pages[current]?.querySelectorAll('.process-schematic').forEach(clearProcessToolTransfer);
      pages[current]?.querySelectorAll('iframe[data-scene]').forEach(frame=>{
        if(frame.dataset.connected==='true')frame.contentWindow.postMessage({type:document.hidden?'catpaw:scene-deactivate':'catpaw:scene-activate',scene:frame.dataset.scene,greetingText:sharedGreetingText},'*');
      });
    });
    window.addEventListener('beforeprint',()=>pages.forEach(page=>{ensureFrames(page);fitDemo(page)}));
    window.addEventListener('afterprint',()=>journal.fit());
    pages.forEach(page=>page.querySelectorAll('.demo-viewport iframe').forEach(frame=>{
      frame.addEventListener('load',()=>{if(!frame.hasAttribute('src'))return;frame.dataset.loaded='true';fitDemo(page);revealDemo(page)});
    }));
    const journal=CatPawStrategyJournal.create({stage,canvas,pages,slides,ranges:deckPhaseRanges,pointGroups:deckPointGroups,initialIndex:current,onChange:activate,onLayout:fitDemo});
    journal.fit();
  </script>
</body>
</html>
