<!doctype html>
<html lang="zh-CN" class="white-background-lab">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Lab · 背景动效</title>
  <link rel="stylesheet" href="lab.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="background-motion.css">
  <script src="header.js" defer></script>
  <script src="background-motion.js" defer></script>
</head>
<body class="background-motion-page">
  <aside class="lab-sidebar" aria-label="Motion Lab 导航">
    <div class="lab-navigation-panel">
      <div class="lab-navigation-heading">
        <a class="wordmark" href="index.html">Motion Lab</a>
      </div>
      <nav aria-label="测试页面">
        <a href="index.html">Text &amp; tools</a>
        <a href="background-motion.html" aria-current="page">背景动效</a>
        <a href="task-plan.html">Task list</a>
        <a href="agent-motion.html">Subagent motion</a>
        <a href="percentage.html">Percentage</a>
        <a href="copy-icon.html">Copy icon</a>
      </nav>
    </div>

    <div class="lab-chrome">
      <div class="lab-toolbar-wrap">
        <section class="toolbar" aria-label="背景测试控制">
          <div class="control-group">
            <button class="primary" type="button" id="background-play">暂停</button>
            <button type="button" id="background-replay">重播</button>
          </div>
          <div class="control-group">
            <label>速度
              <select id="background-speed">
                <option value=".5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="1.5">1.5×</option>
              </select>
            </label>
            <label>
              <span class="intensity-label">纹理强度 <output id="background-strength-value" for="background-strength">70%</output></span>
              <input type="range" id="background-strength" min="0" max="100" value="70">
            </label>
          </div>
        </section>
      </div>
    </div>
  </aside>

  <main>
    <h1 class="background-heading">背景动效</h1>
    <div class="background-workspace">
      <section aria-labelledby="matrix-heading">
        <h2 class="matrix-heading" id="matrix-heading">矩阵点</h2>
        <fieldset class="motion-pattern-selector">
          <legend>图案</legend>
          <div class="motion-options">
            <label><input type="radio" name="matrix-pattern" value="diagonal" checked><span>斜线</span></label>
            <label><input type="radio" name="matrix-pattern" value="rings"><span>同心环</span></label>
            <label><input type="radio" name="matrix-pattern" value="checker"><span>棋盘格</span></label>
            <label><input type="radio" name="matrix-pattern" value="code"><span>代码</span></label>
          </div>
        </fieldset>
        <div class="background-surface" aria-hidden="true">
          <svg class="background-texture matrix-field" viewBox="0 0 864 432" preserveAspectRatio="xMidYMid slice">
            <defs>
              <pattern id="matrix-dots" width="18" height="18" patternUnits="userSpaceOnUse">
                <circle cx="9" cy="9" r="1.25" fill="currentColor"/>
              </pattern>
            </defs>
            <rect width="864" height="432" fill="url(#matrix-dots)" class="matrix-base"/>
            <g class="matrix-pattern"></g>
          </svg>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
