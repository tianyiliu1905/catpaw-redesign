<script>
const source=document.getElementById('source').innerHTML;
for(const target of document.querySelectorAll('.animated'))target.innerHTML=source.replaceAll('pixel-reveal',`pixel-reveal-${target.dataset.id}`);
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animations(){return [...document.querySelectorAll('.animated svg')].flatMap(svg=>svg.getAnimations({subtree:true}));}
function label(){document.getElementById('play').textContent=paused?'播放':'暂停';}
function replay(){const epoch=document.timeline.currentTime;for(const a of animations()){a.play();a.startTime=epoch;a.playbackRate=Number(document.getElementById('speed').value);if(paused)a.pause();}label();}
document.getElementById('play').onclick=()=>{paused=!paused;animations().forEach(a=>paused?a.pause():a.play());label();};
document.getElementById('replay').onclick=replay;
document.getElementById('speed').onchange=e=>animations().forEach(a=>a.updatePlaybackRate(Number(e.target.value)));
requestAnimationFrame(replay);
</script></main></body></html>
