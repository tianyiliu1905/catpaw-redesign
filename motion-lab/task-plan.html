<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatPaw · Task List Motion</title><link rel="stylesheet" href="assets/catpaw-tokens.css"><link rel="stylesheet" href="lab.css"><link rel="stylesheet" href="task-plan.css"><link rel="stylesheet" href="header.css"></head>
<body><div class="task-sticky-controls lab-chrome"><header class="topbar"><a class="wordmark" href="index.html">CatPaw <span>Motion Lab</span></a><nav aria-label="Test pages"><a href="index.html">Text & tools</a><a href="agent-motion.html">Subagent motion</a><a href="task-plan.html" aria-current="page">Task list</a><a href="icon-pixel.html">Icon pixel</a></nav></header>
