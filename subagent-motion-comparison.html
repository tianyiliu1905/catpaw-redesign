<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子智能体连线动画对比</title>
<style>
:root{--type-md:14px;--line-md:22px}
*{box-sizing:border-box}body{margin:0;background:#f9f9f9;color:#2b2b2b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1200px;margin:56px auto;padding:0 32px}h1{font-size:28px;margin:0 0 8px}p{color:#737373;margin:0 0 24px}.controls{display:flex;align-items:center;gap:12px;margin:24px 0}button,select{height:32px;border:1px solid #e5e5e5;border-radius:8px;background:white;padding:0 12px;font:inherit;color:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:white;border:1px solid #e5e5e5;border-radius:16px;padding:28px}h2{font-size:18px;margin:0 0 6px;font-weight:500}.note{font-size:13px;min-height:44px}.demo{position:relative;margin:30px 0 10px;height:220px}.heading{display:flex;align-items:center;gap:8px;font-size:16px;color:#737373}.heading img{width:19px;height:19px;flex-shrink:0}.heading-copy{background:linear-gradient(105deg,#737373 0%,#737373 38%,#2b2b2b 49%,#2b2b2b 51%,#737373 62%,#737373 100%);background-size:240% 100%;background-position:100% 0;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.rows{margin:4px 0 0 27px}.row{height:38px;display:flex;align-items:center;gap:8px;font-size:var(--type-md);line-height:var(--line-md);color:#505050}.row:last-child{color:#a6a6a6}.agent-icon{display:grid;place-items:center;width:24px;height:24px;flex:0 0 24px;border-radius:6px;background:#ecf7ef;color:#4bcc7a}.agent-icon svg{display:block;width:18px;height:18px}.row:nth-child(2) .agent-icon{background:#edf4ff;color:#5b91df}.row:nth-child(3) .agent-icon{background:#f3effb;color:#9a78cf}.row:nth-child(4) .agent-icon{background:#f5f5f5;color:#bfbfbf}.demo>svg{position:absolute;left:0;top:25px;width:100%;height:170px;overflow:visible;pointer-events:none}.demo>svg path{fill:none;stroke-width:1.2;stroke-linecap:butt}.base{stroke:#f2f2f2}.packet{stroke:#a6a6a6;opacity:0}.footer{border-top:1px solid #f2f2f2;padding-top:18px;color:#737373;font-size:13px}.legend{margin-top:24px;font-size:13px}@media(max-width:780px){.grid{grid-template-columns:1fr}main{margin:24px auto;padding:0 16px}}@media(prefers-reduced-motion:reduce){.legend::after{content:' 已根据系统设置暂停自动播放，可点击播放查看。'}}
</style></head><body><main><h1>子智能体连线动画</h1><p>同一组任务、同一轮时长，对比光段到达末端的节奏。</p><div class="controls"><button id="play">暂停</button><button id="replay">同步重播</button><label>播放速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label></div><div class="grid">
<section class="panel" data-mode="current"><h2>A · 连续派发</h2><p class="note">保留原有运动方式；上一组尚未走完，下一组便开始出发。</p><div class="demo"></div><div class="footer">每半轮派出一组，前后两组交错循环。</div></section>
<section class="panel" data-mode="aligned"><h2>B · 沿竖线依次分流</h2><p class="note">光段沿竖线向下分流；上一组尚未走完，下一组便开始出发。</p><div class="demo"></div><div class="footer">各分支保持相同速度，每半轮派出一组，经过弯角向右分流。</div></section></div><p class="legend">前三项展示运行中的连线；最后一项保持等待状态。此页面独立于正式 Demo。</p></main>
<script>
const ns='http://www.w3.org/2000/svg', animations=[];let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const names=['核对超时时长','评估影响范围','排查重复异常','复核分析结论'];

const packets=[];
for(const panel of document.querySelectorAll('.panel')){
const demo=panel.querySelector('.demo');demo.innerHTML='<div class="heading"><img src="assets/subagent-figma.svg" alt=""><span class="heading-copy">正在调用子智能体，并行分析门店异常</span></div><div class="rows">'+names.map(n=>`<div class="row"><span class="agent-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 5.33333V2.66667H5.33333" stroke-width="1.12" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M4 5.33333H12C12.7364 5.33333 13.3333 5.93029 13.3333 6.66667V12C13.3333 12.7364 12.7364 13.3333 12 13.3333H4C3.26362 13.3333 2.66667 12.7364 2.66667 12V6.66667C2.66667 5.93029 3.26362 5.33333 4 5.33333Z" stroke-width="1.12" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M1.33333 9.33333H2.66667" stroke-width="1.12" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M13.3333 9.33333H14.6667" stroke-width="1.12" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M10 8.66667V10" stroke-width="1.12" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M6 8.66667V10" stroke-width="1.12" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/></svg></span><span>${n}</span></div>`).join('')+'</div>';
const svg=document.createElementNS(ns,'svg');demo.append(svg);
const defs=document.createElementNS(ns,'defs'),baseLayer=document.createElementNS(ns,'g'),motionLayer=document.createElementNS(ns,'g');svg.append(defs,baseLayer,motionLayer);
const svgTop=svg.getBoundingClientRect().top;
const routes=[...demo.querySelectorAll('.row')].map(row=>{const rect=row.getBoundingClientRect();const y=rect.top+rect.height/2-svgTop;const endX=row.querySelector('.agent-icon').getBoundingClientRect().left-svg.getBoundingClientRect().left;return `M9.5 0V${y-8}Q9.5 ${y} 17.5 ${y}H${endX}`;});
routes.forEach((d,i)=>{
 const base=document.createElementNS(ns,'path');base.setAttribute('d',d);base.setAttribute('class','base');baseLayer.append(base);
 if(i===3)return;
 const length=base.getTotalLength();
 for(let group=0;group<2;group++){
  const p=base.cloneNode(),gradient=document.createElementNS(ns,'linearGradient');
  const id=`packet-tail-${panel.dataset.mode}-${i}-${group}`;
  gradient.id=id;gradient.setAttribute('gradientUnits','userSpaceOnUse');
  for(const [offset,opacity] of [[0,0],[.18,.35],[.4,.8],[.55,1],[1,1]]){
   const stop=document.createElementNS(ns,'stop');stop.setAttribute('offset',offset);stop.setAttribute('stop-color','#a6a6a6');stop.setAttribute('stop-opacity',opacity);gradient.append(stop);
  }
  defs.append(gradient);p.setAttribute('class','packet');p.style.stroke=`url(#${id})`;p.setAttribute('d','');motionLayer.append(p);
  packets.push({p,gradient,route:base,length,mode:panel.dataset.mode,group});
 }
});
}
const duration=Math.max(1100,Math.min(2600,(Math.max(...packets.map(x=>x.length))+40)*14));
function start(){animations.forEach(a=>a.cancel());animations.length=0;const epoch=document.timeline.currentTime;
for(const label of document.querySelectorAll('.heading-copy')){
 const a=label.animate([{backgroundPosition:'100% 0',offset:0},{backgroundPosition:'100% 0',offset:.12},{backgroundPosition:'0% 0',offset:.88},{backgroundPosition:'0% 0',offset:1}],{duration:2400,iterations:Infinity,easing:'linear'});
 a.startTime=epoch;a.playbackRate=Number(document.getElementById('speed').value);if(paused)a.pause();animations.push(a);
}
for(const packet of packets){const {p,length,mode}=packet;const frames=mode==='current'?[{opacity:0,offset:0},{opacity:1,offset:.06},{opacity:1,offset:.94},{opacity:0,offset:1}]:[{opacity:0,offset:0},{opacity:1,offset:.06},{opacity:1,offset:.8},{opacity:0,offset:.9},{opacity:0,offset:1}];const a=p.animate(frames,{duration,delay:packet.group*duration/2,iterations:Infinity,easing:'linear'});a.startTime=epoch;a.playbackRate=Number(document.getElementById('speed').value);if(paused)a.pause();packet.animation=a;animations.push(a);}document.getElementById('play').textContent=paused?'播放':'暂停';}
// Keep the original travel timing; move each tail gradient with its packet.
const alignedTravel=Math.max(...packets.filter(packet=>packet.mode==='aligned').map(packet=>packet.length))+28;
function drawPackets(){
 for(const {p,gradient,route,length,mode,group,animation} of packets){
  if(!animation)continue;
  const elapsed=(animation.currentTime||0)-group*duration/2;
  if(elapsed<0){p.setAttribute('d','');continue;}
  const phase=(elapsed%duration)/duration;
  const travel=mode==='aligned'?alignedTravel*Math.min(phase/.85,1):-2+(length+60)*phase;
  const end=Math.min(length,travel),begin=Math.max(0,travel-28);
  if(begin>=end){p.setAttribute('d','');continue;}
  const points=[];
  for(let distance=begin;distance<end;distance+=.5)points.push(route.getPointAtLength(distance));
  points.push(route.getPointAtLength(end));
  const tail=points[0],head=points[points.length-1];
  gradient.setAttribute('x1',tail.x);gradient.setAttribute('y1',tail.y);
  gradient.setAttribute('x2',head.x);gradient.setAttribute('y2',head.y);
  p.setAttribute('d',points.map((point,i)=>`${i?'L':'M'}${point.x} ${point.y}`).join(' '));
 }
 requestAnimationFrame(drawPackets);
}
requestAnimationFrame(drawPackets);
document.getElementById('play').onclick=()=>{paused=!paused;animations.forEach(a=>paused?a.pause():a.play());document.getElementById('play').textContent=paused?'播放':'暂停';};document.getElementById('replay').onclick=start;document.getElementById('speed').onchange=e=>animations.forEach(a=>a.updatePlaybackRate(Number(e.target.value)));start();
</script></body></html>
