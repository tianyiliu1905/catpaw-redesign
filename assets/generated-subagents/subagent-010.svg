<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#86DBE0"><ellipse cx="59.36" cy="66.14" rx="41.24" ry="35.95" transform="rotate(217.53 59.36 66.14)"/>
<ellipse cx="100.64" cy="97.86" rx="41.24" ry="35.95" transform="rotate(217.53 100.64 97.86)"/>
