<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Subagent catpaw-4">
<rect width="160" height="160" rx="34" fill="#ECF9F4"/>
<defs>
  <linearGradient id="edge-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
  <linearGradient id="soft-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <mask id="sharp-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#edge-fade)"/></mask>
  <mask id="soft-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#soft-fade)"/></mask>
  <filter id="left-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<!-- Enlarge the complete character together inside the unchanged tile. -->
<g transform="translate(80 80) scale(1.1) translate(-80 -80)">
<!-- Composite the solid union before filtering; facial features stay above both layers. -->
<g mask="url(#soft-edge)"><g fill="#8FDDC7" filter="url(#left-soft)"><ellipse cx="59.04" cy="88.01" rx="39.44" ry="33.83" transform="rotate(163.98 59.04 88.01)"/>
<ellipse cx="100.96" cy="75.99" rx="39.44" ry="33.83" transform="rotate(163.98 100.96 75.99)"/>
<ellipse cx="73.5" cy="60.58" rx="37.43" ry="32.82" transform="rotate(253.11 73.5 60.58)"/>
<ellipse cx="86.5" cy="103.42" rx="37.43" ry="32.82" transform="rotate(253.11 86.5 103.42)"/>
<ellipse cx="80" cy="82" rx="37.7" ry="37.58" transform="rotate(170.4 80 82)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#8FDDC7"><ellipse cx="59.04" cy="88.01" rx="39.44" ry="33.83" transform="rotate(163.98 59.04 88.01)"/>
<ellipse cx="100.96" cy="75.99" rx="39.44" ry="33.83" transform="rotate(163.98 100.96 75.99)"/>
<ellipse cx="73.5" cy="60.58" rx="37.43" ry="32.82" transform="rotate(253.11 73.5 60.58)"/>
<ellipse cx="86.5" cy="103.42" rx="37.43" ry="32.82" transform="rotate(253.11 86.5 103.42)"/>
<ellipse cx="80" cy="82" rx="37.7" ry="37.58" transform="rotate(170.4 80 82)"/></g></g>
<g data-face="wide-smile" transform="translate(83 91) scale(1.8975)"><defs><clipPath id="eye-white-0"><ellipse cx="-11" cy="-5" rx="6.7" ry="6.7"/></clipPath></defs><ellipse cx="-11" cy="-5" rx="6.7" ry="6.7" fill="#FFFFFF"/><ellipse cx="-7.699999999999999" cy="-5" rx="3.9" ry="3.9" fill="#21836E" clip-path="url(#eye-white-0)"/><defs><clipPath id="eye-white-1"><ellipse cx="11" cy="-5" rx="6.7" ry="6.7"/></clipPath></defs><ellipse cx="11" cy="-5" rx="6.7" ry="6.7" fill="#FFFFFF"/><ellipse cx="14.3" cy="-5" rx="3.9" ry="3.9" fill="#21836E" clip-path="url(#eye-white-1)"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><path d="M -5 7 C -5 12.3 5 12.3 5 7" fill="none" stroke="#21836E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</g>
