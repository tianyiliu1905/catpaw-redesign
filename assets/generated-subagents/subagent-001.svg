<ellipse cx="80" cy="82" rx="35.71" ry="35.43" transform="rotate(78.97 80 82)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#CEC0FB"><ellipse cx="81.33" cy="104.41" rx="37.59" ry="36.36" transform="rotate(86.61 81.33 104.41)"/>
<ellipse cx="78.67" cy="59.59" rx="37.59" ry="36.36" transform="rotate(86.61 78.67 59.59)"/>
