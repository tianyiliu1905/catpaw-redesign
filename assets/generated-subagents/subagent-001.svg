<ellipse cx="80" cy="82" rx="35.71" ry="35.43" transform="rotate(78.97 80 82)"/></g></g>
<g data-face="wide-smile" transform="translate(83 91) scale(1.8975)"><defs><clipPath id="eye-white-0"><ellipse cx="-11" cy="-5" rx="6.7" ry="6.7"/></clipPath></defs><ellipse cx="-11" cy="-5" rx="6.7" ry="6.7" fill="#FFFFFF"/><ellipse cx="-7.699999999999999" cy="-5" rx="3.9" ry="3.9" fill="#7666A2" clip-path="url(#eye-white-0)"/><defs><clipPath id="eye-white-1"><ellipse cx="11" cy="-5" rx="6.7" ry="6.7"/></clipPath></defs><ellipse cx="11" cy="-5" rx="6.7" ry="6.7" fill="#FFFFFF"/><ellipse cx="14.3" cy="-5" rx="3.9" ry="3.9" fill="#7666A2" clip-path="url(#eye-white-1)"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><path d="M -5 7 C -5 12.3 5 12.3 5 7" fill="none" stroke="#7666A2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
