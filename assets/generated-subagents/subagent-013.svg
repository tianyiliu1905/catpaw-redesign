<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Subagent catpaw-13">
<rect width="160" height="160" rx="34" fill="#EEF6FF"/>
<defs>
  <linearGradient id="edge-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
  <linearGradient id="soft-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <mask id="sharp-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#edge-fade)"/></mask>
  <mask id="soft-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#soft-fade)"/></mask>
  <filter id="left-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<!-- Enlarge the complete character together inside the unchanged tile. -->
<g transform="translate(80 80) scale(1.1) translate(-80 -80)">
<!-- Composite the solid union before filtering; facial features stay above both layers. -->
<g mask="url(#soft-edge)"><g fill="#A2CFFF" filter="url(#left-soft)"><ellipse cx="59.17" cy="79.77" rx="34.68" ry="29.7" transform="rotate(186.12 59.17 79.77)"/>
<ellipse cx="100.83" cy="84.23" rx="34.68" ry="29.7" transform="rotate(186.12 100.83 84.23)"/>
<ellipse cx="85.86" cy="59.32" rx="37.57" ry="33.34" transform="rotate(284.49 85.86 59.32)"/>
<ellipse cx="74.14" cy="104.68" rx="37.57" ry="33.34" transform="rotate(284.49 74.14 104.68)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#A2CFFF"><ellipse cx="59.17" cy="79.77" rx="34.68" ry="29.7" transform="rotate(186.12 59.17 79.77)"/>
<ellipse cx="100.83" cy="84.23" rx="34.68" ry="29.7" transform="rotate(186.12 100.83 84.23)"/>
<ellipse cx="85.86" cy="59.32" rx="37.57" ry="33.34" transform="rotate(284.49 85.86 59.32)"/>
<ellipse cx="74.14" cy="104.68" rx="37.57" ry="33.34" transform="rotate(284.49 74.14 104.68)"/></g></g>
<g data-face="squint-surprised" transform="translate(83 91) scale(1.8975)"><path d="M -14 -9 L -9 -5 L -14 -1" fill="none" stroke="#4475A6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 14 -9 L 9 -5 L 14 -1" fill="none" stroke="#4475A6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><ellipse cx="0" cy="9" rx="3.9" ry="4.1" fill="none" stroke="#4475A6" stroke-width="3"/></g></g>
</g>
</svg>
