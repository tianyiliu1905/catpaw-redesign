<ellipse cx="80.52" cy="58.76" rx="36.76" ry="28.1" transform="rotate(451.28 80.52 58.76)"/></g></g>
<g data-face="dots-surprised" transform="translate(83 91) scale(1.8975)"><ellipse cx="-11" cy="-5" rx="2.8" ry="3.7" fill="#8B6D28"/><ellipse cx="11" cy="-5" rx="2.8" ry="3.7" fill="#8B6D28"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><ellipse cx="0" cy="9" rx="3.9" ry="4.1" fill="none" stroke="#8B6D28" stroke-width="3"/></g></g>
