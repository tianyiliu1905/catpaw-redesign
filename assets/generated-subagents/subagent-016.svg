<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Subagent catpaw-16">
<rect width="160" height="160" rx="34" fill="#ECF9F4"/>
<defs>
  <linearGradient id="edge-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
  <linearGradient id="soft-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <mask id="sharp-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#edge-fade)"/></mask>
  <mask id="soft-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#soft-fade)"/></mask>
  <filter id="left-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<!-- Enlarge the complete character together inside the unchanged tile. -->
<g transform="translate(80 80) scale(1.1) translate(-80 -80)">
<!-- Composite the solid union before filtering; facial features stay above both layers. -->
<g mask="url(#soft-edge)"><g fill="#8FDDC7" filter="url(#left-soft)"><ellipse cx="102.99" cy="83.8" rx="37.03" ry="32.48" transform="rotate(364.48 102.99 83.8)"/>
<ellipse cx="57.01" cy="80.2" rx="37.03" ry="32.48" transform="rotate(364.48 57.01 80.2)"/>
<ellipse cx="80.25" cy="103.17" rx="32.99" ry="30.93" transform="rotate(449.31 80.25 103.17)"/>
<ellipse cx="79.75" cy="60.83" rx="32.99" ry="30.93" transform="rotate(449.31 79.75 60.83)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#8FDDC7"><ellipse cx="102.99" cy="83.8" rx="37.03" ry="32.48" transform="rotate(364.48 102.99 83.8)"/>
<ellipse cx="57.01" cy="80.2" rx="37.03" ry="32.48" transform="rotate(364.48 57.01 80.2)"/>
<ellipse cx="80.25" cy="103.17" rx="32.99" ry="30.93" transform="rotate(449.31 80.25 103.17)"/>
<ellipse cx="79.75" cy="60.83" rx="32.99" ry="30.93" transform="rotate(449.31 79.75 60.83)"/></g></g>
<g data-face="wide-pout" transform="translate(83 91) scale(1.8975)"><defs><clipPath id="eye-white-0"><ellipse cx="-11" cy="-5" rx="6.7" ry="6.7"/></clipPath></defs><ellipse cx="-11" cy="-5" rx="6.7" ry="6.7" fill="#FFFFFF"/><ellipse cx="-7.699999999999999" cy="-5" rx="3.9" ry="3.9" fill="#21836E" clip-path="url(#eye-white-0)"/><defs><clipPath id="eye-white-1"><ellipse cx="11" cy="-5" rx="6.7" ry="6.7"/></clipPath></defs><ellipse cx="11" cy="-5" rx="6.7" ry="6.7" fill="#FFFFFF"/><ellipse cx="14.3" cy="-5" rx="3.9" ry="3.9" fill="#21836E" clip-path="url(#eye-white-1)"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><path d="M 2 5 Q -5 5 -1 9 Q -5 13 2 13" fill="none" stroke="#21836E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</g>
