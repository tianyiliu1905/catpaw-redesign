<ellipse cx="86.06" cy="61.52" rx="40.2" ry="30.57" transform="rotate(466.47 86.06 61.52)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#FCB6AF"><ellipse cx="100.99" cy="79.86" rx="34.02" ry="24.1" transform="rotate(354.19 100.99 79.86)"/>
<ellipse cx="59.01" cy="84.14" rx="34.02" ry="24.1" transform="rotate(354.19 59.01 84.14)"/>
