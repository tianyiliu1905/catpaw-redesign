<ellipse cx="86.06" cy="61.52" rx="40.2" ry="30.57" transform="rotate(466.47 86.06 61.52)"/></g></g>
<g data-face="dots-surprised" transform="translate(83 91) scale(1.8975)"><ellipse cx="-11" cy="-5" rx="2.8" ry="3.7" fill="#A15B55"/><ellipse cx="11" cy="-5" rx="2.8" ry="3.7" fill="#A15B55"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><ellipse cx="0" cy="9" rx="3.9" ry="4.1" fill="none" stroke="#A15B55" stroke-width="3"/></g></g>
