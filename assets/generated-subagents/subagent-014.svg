<g mask="url(#soft-edge)"><g fill="#CEC0FB" filter="url(#left-soft)"><ellipse cx="96.2" cy="97.08" rx="37.76" ry="34.96" transform="rotate(42.93 96.2 97.08)"/>
<ellipse cx="63.8" cy="66.92" rx="37.76" ry="34.96" transform="rotate(42.93 63.8 66.92)"/>
