<ellipse cx="80" cy="82" rx="40.82" ry="36.85" transform="rotate(35.4 80 82)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#CEC0FB"><ellipse cx="96.2" cy="97.08" rx="37.76" ry="34.96" transform="rotate(42.93 96.2 97.08)"/>
<ellipse cx="63.8" cy="66.92" rx="37.76" ry="34.96" transform="rotate(42.93 63.8 66.92)"/>
