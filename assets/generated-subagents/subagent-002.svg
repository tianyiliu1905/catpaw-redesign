<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Subagent catpaw-1">
<rect width="160" height="160" rx="34" fill="#EEF6FF"/>
<defs>
  <linearGradient id="edge-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
  <linearGradient id="soft-fade" gradientUnits="userSpaceOnUse" x1="28" y1="132" x2="100" y2="65"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <mask id="sharp-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#edge-fade)"/></mask>
  <mask id="soft-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><rect width="160" height="160" fill="url(#soft-fade)"/></mask>
  <filter id="left-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="160"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<!-- Enlarge the complete character together inside the unchanged tile. -->
<g transform="translate(80 80) scale(1.1) translate(-80 -80)">
<!-- Composite the solid union before filtering; facial features stay above both layers. -->
<g mask="url(#soft-edge)"><g fill="#A2CFFF" filter="url(#left-soft)"><ellipse cx="61.56" cy="92.43" rx="38.22" ry="33.74" transform="rotate(150.49 61.56 92.43)"/>
<ellipse cx="98.44" cy="71.57" rx="38.22" ry="33.74" transform="rotate(150.49 98.44 71.57)"/>
<ellipse cx="72.03" cy="62.49" rx="40.78" ry="38.73" transform="rotate(247.77 72.03 62.49)"/>
<ellipse cx="87.97" cy="101.51" rx="40.78" ry="38.73" transform="rotate(247.77 87.97 101.51)"/>
<ellipse cx="80" cy="82" rx="38.88" ry="36.74" transform="rotate(148.63 80 82)"/></g></g>
<g mask="url(#sharp-edge)" data-body="ellipse-union"><g fill="#A2CFFF"><ellipse cx="61.56" cy="92.43" rx="38.22" ry="33.74" transform="rotate(150.49 61.56 92.43)"/>
<ellipse cx="98.44" cy="71.57" rx="38.22" ry="33.74" transform="rotate(150.49 98.44 71.57)"/>
<ellipse cx="72.03" cy="62.49" rx="40.78" ry="38.73" transform="rotate(247.77 72.03 62.49)"/>
<ellipse cx="87.97" cy="101.51" rx="40.78" ry="38.73" transform="rotate(247.77 87.97 101.51)"/>
<ellipse cx="80" cy="82" rx="38.88" ry="36.74" transform="rotate(148.63 80 82)"/></g></g>
<g data-face="happy-surprised" transform="translate(83 91) scale(1.8975)"><path d="M -15 -3 Q -11 -10 -7 -3" fill="none" stroke="#4475A6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 7 -3 Q 11 -10 15 -3" fill="none" stroke="#4475A6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><ellipse cx="0" cy="9" rx="3.9" ry="4.1" fill="none" stroke="#4475A6" stroke-width="3"/></g></g>
</g>
