<g data-face="dots-surprised" transform="translate(83 91) scale(1.8975)"><ellipse cx="-11" cy="-5" rx="2.8" ry="3.7" fill="#217D9B"/><ellipse cx="11" cy="-5" rx="2.8" ry="3.7" fill="#217D9B"/><g transform="translate(0 9) scale(.85) translate(0 -9)"><ellipse cx="0" cy="9" rx="3.9" ry="4.1" fill="none" stroke="#217D9B" stroke-width="3"/></g></g>
