.web-devices-art { --web-ink:#171717; --web-paper:#fff; --web-gray:#a8aaa8; color:var(--web-ink); opacity:.4; transition:opacity .18s ease; }
.web-devices-art .web-desktop-hero { animation:webDesktopHero 3s ease-in-out infinite paused; }
.web-devices-art .web-desktop-cards { animation:webDesktopCards 3s ease-in-out infinite paused; }
.web-devices-art .web-mobile-content { animation:webMobileContent 3s ease-in-out infinite paused; }
.web-devices-art .web-phone { animation:webPhoneFloat 3s ease-in-out infinite paused; }
.pill:hover .web-devices-art, .pill:focus-visible .web-devices-art, .web-devices-art:hover { opacity:1; }
.pill:hover .web-devices-art .web-motion,
.pill:focus-visible .web-devices-art .web-motion,
.web-devices-art:hover .web-motion { animation-play-state:running; }
@keyframes webDesktopHero {
  0%, 6%, 100% { opacity:0; transform:translateY(3px); }
  22%, 82% { opacity:1; transform:translateY(0); }
  96% { opacity:0; transform:translateY(0); }
}
@keyframes webDesktopCards {
  0%, 18%, 100% { opacity:0; transform:translateY(4px); }
  36%, 82% { opacity:1; transform:translateY(0); }
  96% { opacity:0; transform:translateY(0); }
}
@keyframes webMobileContent {
  0%, 36%, 100% { opacity:0; transform:translateY(5px); }
  58%, 82% { opacity:1; transform:translateY(0); }
  96% { opacity:0; transform:translateY(0); }
}
@keyframes webPhoneFloat {
  0%, 30%, 100% { transform:translateY(0); }
  56%, 76% { transform:translateY(-4px); }
}
@media (prefers-reduced-motion:reduce) {
  .web-devices-art { transition:none; }
  .web-devices-art .web-motion { animation:none; opacity:1; transform:none; }
}

.pill:hover .web-devices-art,
.pill:focus-visible .web-devices-art,
.web-devices-art:hover { --web-gray:#7fffb4; }
